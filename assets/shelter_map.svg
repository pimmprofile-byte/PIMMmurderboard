<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img"
     preserveAspectRatio="xMidYMid meet"
     font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <title>평화누리 캠핑장 배치도</title>
  <desc>관리동 취사장 발전동 텐트터 창고 숲길 여섯 구역</desc>

  <defs>
    <!-- 능선 너머에서 올라오는 것. 위쪽에만 얇게 깔린다 — 이 사건의 얼굴이다. -->
    <linearGradient id="smoke" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#8fbf4a" stop-opacity=".26"/>
      <stop offset=".55" stop-color="#8fbf4a" stop-opacity=".07"/>
      <stop offset="1"   stop-color="#8fbf4a" stop-opacity="0"/>
    </linearGradient>
    <style><![CDATA[
      text { pointer-events:none; }
      .ridge { fill:none; stroke:#5f7a52; stroke-width:2.2; opacity:.75; }
      .trim  { fill:none; stroke:#5f7a52; stroke-width:1.3; opacity:.38; }
      .zone-fill { fill:#141c17; stroke:#6d8a5e; stroke-width:1.3;
                   transition:fill .15s ease, stroke .15s ease; }
      .z-name { fill:#e6efe2; font-size:19px; font-weight:700; }
      .z-cnt  { fill:#9db892; font-size:14px; font-weight:700;
                font-variant-numeric:tabular-nums; }
      /* 숲길은 나머지 다섯을 감싸고 있다. 실제로 그런 지형이다. */
      .wood { fill:#101711; stroke:#5f7a52; stroke-width:1.6; }
      .tree { fill:#0b0f0c; stroke:#5f7a52; stroke-width:1.2; opacity:.55; }
    ]]></style>
  </defs>

  <rect width="720" height="310" fill="#0b0f0c"/>

  <!-- 산자락. 부지는 이 아래 평평한 데 앉아 있다 -->
  <path class="ridge" d="M0 34 L104 8 L188 30 L268 6 L372 30 L470 4 L566 28 L648 8 L720 30"/>
  <rect x="0" y="0" width="720" height="96" fill="url(#smoke)"/>

  <!-- 숲길(F) — 도넛. 가운데 빈터는 뚫려 있어서 안쪽 클릭은 각 구역이 받는다 -->
  <g id="zone-F" data-loc="F">
    <path class="wood" fill-rule="evenodd"
          d="M26 46 a12 12 0 0 1 12-12 H682 a12 12 0 0 1 12 12 V284 a12 12 0 0 1-12 12
             H38 a12 12 0 0 1-12-12 Z
             M76 56 H644 V244 H76 Z"/>
    <text class="z-name" x="46" y="277" font-size="16">숲길</text>
    <text class="z-cnt" id="cnt-F" x="674" y="277" text-anchor="end">0/0</text>
  </g>
  <g class="tree">
    <path d="M50 76 l7 15 h-14 Z"/><path d="M50 116 l7 15 h-14 Z"/>
    <path d="M50 156 l7 15 h-14 Z"/><path d="M50 196 l7 15 h-14 Z"/>
    <path d="M50 236 l7 15 h-14 Z"/>
    <path d="M670 76 l7 15 h-14 Z"/><path d="M670 116 l7 15 h-14 Z"/>
    <path d="M670 156 l7 15 h-14 Z"/><path d="M670 196 l7 15 h-14 Z"/>
    <path d="M670 236 l7 15 h-14 Z"/>
    <path d="M160 38 l6 14 h-12 Z"/><path d="M280 38 l6 14 h-12 Z"/>
    <path d="M400 38 l6 14 h-12 Z"/><path d="M520 38 l6 14 h-12 Z"/>
  </g>
  <!-- 부지로 들어오는 단 하나의 길 -->
  <g class="trim">
    <path d="M360 296 v14"/>
    <path d="M348 306 h24"/>
  </g>

  <g id="zones">
    <g id="zone-A" data-loc="A">
      <rect class="zone-fill" x="92" y="66" width="168" height="82" rx="6"/>
      <text class="z-name" x="108" y="102">관리동</text>
      <text class="z-cnt" id="cnt-A" x="244" y="136" text-anchor="end">0/0</text>
    </g>
    <g id="zone-B" data-loc="B">
      <rect class="zone-fill" x="276" y="66" width="152" height="82" rx="6"/>
      <text class="z-name" x="292" y="102" font-size="17">취사장</text>
      <text class="z-cnt" id="cnt-B" x="412" y="136" text-anchor="end">0/0</text>
    </g>
    <g id="zone-C" data-loc="C">
      <rect class="zone-fill" x="444" y="66" width="184" height="82" rx="6"/>
      <text class="z-name" x="460" y="102">발전동</text>
      <text class="z-cnt" id="cnt-C" x="612" y="136" text-anchor="end">0/0</text>
    </g>

    <g id="zone-D" data-loc="D">
      <rect class="zone-fill" x="92" y="162" width="260" height="82" rx="6"/>
      <text class="z-name" x="108" y="198">텐트터</text>
      <text class="z-cnt" id="cnt-D" x="336" y="232" text-anchor="end">0/0</text>
    </g>
    <g id="zone-E" data-loc="E">
      <rect class="zone-fill" x="368" y="162" width="260" height="82" rx="6"/>
      <text class="z-name" x="384" y="198">창고</text>
      <text class="z-cnt" id="cnt-E" x="612" y="232" text-anchor="end">0/0</text>
    </g>
  </g>
</svg>
