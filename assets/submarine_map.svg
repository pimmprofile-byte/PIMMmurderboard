<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img"
     preserveAspectRatio="xMidYMid meet"
     font-family="-apple-system,BlinkMacSystemFont,'Noto Sans KR','Apple SD Gothic Neo',sans-serif">
  <title>심해 조사정 구획 배치도</title>
  <desc>함교 선실·격벽통로 통신실 의무실 화물실 기관실 여섯 구역</desc>

  <defs>
    <!-- 선체 안쪽만 물이 차오르게 자르는 틀 -->
    <clipPath id="hullClip">
      <path d="M150 66 H570 a118 118 0 0 1 0 268 H150 a118 118 0 0 1 0-268 Z"/>
    </clipPath>
    <linearGradient id="floodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#cfeaff" stop-opacity=".85"/>
      <stop offset=".04" stop-color="#5aa6cd" stop-opacity=".42"/>
      <stop offset="1"   stop-color="#0d2c42" stop-opacity=".58"/>
    </linearGradient>
    <style><![CDATA[
      text { pointer-events:none; }
      .hull { fill:none; stroke:#7fb4d6; stroke-width:2.4; }
      .trim { fill:none; stroke:#7fb4d6; stroke-width:1.4; opacity:.4; }
      .zone-fill { fill:#0f1b24; stroke:#5f8fae; stroke-width:1.3;
                   transition:fill .15s ease, stroke .15s ease; }
      .z-name { fill:#e8f2f8; font-size:19px; font-weight:700; }
      .z-cnt  { fill:#9fc4d8; font-size:14px; font-weight:700;
                font-variant-numeric:tabular-nums; }
      #floodwater { transition:y .9s linear, height .9s linear; }
    ]]></style>
  </defs>

  <rect width="720" height="400" fill="#0b1016"/>

  <!-- 선체 — 뱃머리 돔과 선미 방향타까지만. 격자·해칭·범례·소항목은 걷어냈다. -->
  <g class="trim">
    <path d="M150 128 q-42 72 0 144"/>
    <path d="M570 128 q42 72 0 144"/>
    <path d="M668 176 h26 M668 224 h26"/>
  </g>
  <path class="hull" d="M150 66 H570 a118 118 0 0 1 0 268 H150 a118 118 0 0 1 0-268 Z"/>

  <!-- 세일 구획 · 탈출 포드 — 아는 사람 지도에만 뜬다(기본은 CSS에서 감춘다) -->
  <g id="pod">
    <path d="M300 66 v-24 h120 v24" fill="#171308" stroke="#c9a24a" stroke-width="1.6"/>
    <circle cx="332" cy="54" r="5" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
    <circle cx="360" cy="54" r="5" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
    <circle cx="388" cy="54" r="5" fill="none" stroke="#c9a24a" stroke-width="1.4"/>
    <text x="432" y="58" fill="#c9a24a" font-size="12" font-weight="700">탈출 포드 · 정원 3</text>
  </g>

  <!-- 침수 연출용. 기본 높이 0 -->
  <g clip-path="url(#hullClip)"><rect id="floodwater" x="0" y="334" width="720" height="0" fill="url(#floodGrad)"/></g>

  <g id="zones">
    <g id="zone-A" data-loc="A">
      <rect class="zone-fill" x="152" y="88" width="176" height="98" rx="6"/>
      <text class="z-name" x="168" y="126">함교</text>
      <text class="z-cnt" id="cnt-A" x="312" y="174" text-anchor="end">0/0</text>
    </g>
    <g id="zone-F" data-loc="F">
      <rect class="zone-fill" x="340" y="88" width="164" height="98" rx="6"/>
      <text class="z-name" x="356" y="126" font-size="16">선실·격벽통로</text>
      <text class="z-cnt" id="cnt-F" x="488" y="174" text-anchor="end">0/0</text>
    </g>
    <g id="zone-E" data-loc="E">
      <rect class="zone-fill" x="516" y="88" width="146" height="98" rx="6"/>
      <text class="z-name" x="532" y="126">통신실</text>
      <text class="z-cnt" id="cnt-E" x="646" y="174" text-anchor="end">0/0</text>
    </g>

    <g id="zone-D" data-loc="D">
      <rect class="zone-fill" x="152" y="206" width="176" height="98" rx="6"/>
      <text class="z-name" x="168" y="244">의무실</text>
      <text class="z-cnt" id="cnt-D" x="312" y="292" text-anchor="end">0/0</text>
    </g>
    <g id="zone-C" data-loc="C">
      <rect class="zone-fill" x="340" y="206" width="164" height="98" rx="6"/>
      <text class="z-name" x="356" y="244">화물실</text>
      <text class="z-cnt" id="cnt-C" x="488" y="292" text-anchor="end">0/0</text>
    </g>
    <g id="zone-B" data-loc="B">
      <rect class="zone-fill" x="516" y="206" width="146" height="98" rx="6"/>
      <text class="z-name" x="532" y="244">기관실</text>
      <text class="z-cnt" id="cnt-B" x="646" y="292" text-anchor="end">0/0</text>
    </g>
  </g>
</svg>
