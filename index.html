/* 브라우저는 사용자 조작 없이 소리를 못 낸다. VN이 열리면 첫 탭에서 한 번만 깨운다. */
function vnArmAudio(){
  let armed=true;
  const go=()=>{
    if(!armed) return;
    const at=vnAt;
    if(!vnAudio()) return;
    armed=false; document.removeEventListener("pointerdown",go,true);
    // 같은 탭이 컷을 넘겼다면 그 컷의 효과음이 알아서 울리므로 겹쳐 울리지 않는다
    setTimeout(()=>{ const c=vnCuts[at];
      if(vnAt===at && c && c.fx && VN_SFX[c.fx]) VN_SFX[c.fx](); },0);
  };
  document.addEventListener("pointerdown",go,true);
}

let vnCuts=[], vnAt=0, vnTimer=null, vnTyping=false;
function vnBuildCuts(){
  const cuts=(SCEN&&SCEN.openingCuts)||[];
  if(cuts.length) return cuts.map(c=>({img:c.img||"",who:c.who||"",fx:c.fx||"",lines:c.lines||[]}));
  const ls=String((SCEN&&SCEN.intro)||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const out=[]; for(let i=0;i<ls.length;i+=2) out.push({img:"",who:"",fx:"",lines:ls.slice(i,i+2)});
  return out;
}
/* "이미 봤다"는 판(roomId) 단위로만 기억한다.
   예전엔 시나리오 이름으로 기억해서, 한 번 본 브라우저는 다음 판에도 안 나왔다.
   서버가 roomId를 안 주는(옛 배포) 경우엔 저장하지 않고 이 세션 안에서만 기억한다 —
   기억할 근거가 없는데 옛 표시에 걸려 영영 안 나오는 것보다 낫다. */
let vnPlayed=null;
function vnSeenKey(){ const rid=(STATE&&STATE.roomId)||""; return rid?("pmb.vn."+rid):""; }
function vnWasSeen(){
  const rid=(STATE&&STATE.roomId)||"-";
  if(vnPlayed===rid) return true;
  const k=vnSeenKey();
  return !!(k&&localStorage.getItem(k));
}
function vnMarkSeen(){
  vnPlayed=(STATE&&STATE.roomId)||"-";
  const k=vnSeenKey(); if(k){ try{ localStorage.setItem(k,"1"); }catch(e){} }
}
function openVN(force){
  // 이미 재생 중이면 손대지 않는다. 폴링(1.5초)마다 여기로 들어오는데 그때마다
  // vnAt=0으로 되감겨서 오프닝이 처음부터 다시 시작되고 있었다.
  if($("vn").classList.contains("on")) return;
  vnCuts=vnBuildCuts();
  if(!vnCuts.length){ console.warn("[vn] 재생할 컷이 없습니다 — 시나리오에 openingCuts가 있는지 확인"); return; }
  if(!force&&vnWasSeen()) return;
  vnMarkSeen();          // 닫을 때가 아니라 열 때 표시한다 — 중간에 새로고침해도 다시 안 튼다
  vnAt=0;
  $("vnMute").textContent=vnMuted?"🔇 소리":"🔊 소리";
  $("vn").classList.add("on"); vnArmAudio(); vnRender();
}
function vnRender(){
  const cut=vnCuts[vnAt]; if(!cut) return;
  const sid=(STATE&&STATE.scenarioId)||"";
  const stage=$("vnStage"), bg=$("vnBg"), sp=$("vnSprite"), emo=$("vnEmo");

  bg.className="vn-bg "+(cut.img||"");
  bg.style.backgroundImage="";
  bg.classList.remove("show"); void bg.offsetWidth; bg.classList.add("show");
  if(sid&&cut.img){
    // 이미지가 실제로 있을 때만 덧입힌다(없으면 위의 그라데이션이 그대로 남는다)
    findAsset(`/assets/${sid}_opening_${cut.img}`, url=>{
      if(url && vnCuts[vnAt]===cut) bg.style.backgroundImage=`url("${url}")`;
    });
  }

  // 화자 — 스프라이트·이름표·강조색
  const ch=cut.who ? (SCEN.characters||[]).find(c=>c.id===cut.who) : null;
  const root=$("vn");
  root.classList.toggle("speak",!!ch);
  sp.classList.remove("show"); emo.classList.remove("show");
  if(ch){
    $("vnName").textContent=ch.name+(ch.job?" · "+ch.job:"");
    root.style.setProperty("--spk",ch.color||"#c9c2b4");
    emo.textContent=ch.avatar||"";
    if(sid){
      findAsset(`/assets/${sid}_portrait_${ch.id}`, url=>{
        if(vnCuts[vnAt]!==cut) return;
        if(url){ sp.src=url; sp.classList.add("show"); }
        else { emo.classList.add("show"); }
      });
    } else { emo.classList.add("show"); }
  } else {
    root.style.removeProperty("--spk");
  }

  // 연출 큐 — 클래스를 지웠다 다시 붙여야 애니메이션이 처음부터 다시 돈다
  stage.className="vn-stage"; void stage.offsetWidth;
  if(cut.fx){
    stage.classList.add("fx-"+cut.fx);
    const play=VN_SFX[cut.fx]; if(play) play();
  }

  $("vnDots").innerHTML=vnCuts.map((_,i)=>`<span class="vn-dot${i===vnAt?" on":""}"></span>`).join("");
  vnType(cut.lines||[], cut.who||"");
}
/* 한 글자씩 찍는다. 문장부호에서 한 박자 쉬어야 대사로 읽힌다.
   글자를 덧붙이는 게 아니라 전체를 깔아두고 안 읽은 쪽을 감추는 방식이라,
   타자가 진행돼도 줄갈이가 처음 잡힌 그대로 유지된다. */
function vnLineHTML(txt,shown){
  return `<span class="vn-on">${esc(txt.slice(0,shown))}</span>`+
         `<span class="vn-off">${esc(txt.slice(shown))}</span>`;
}
function vnType(lines,who){
  const host=$("vnLines");
  host.innerHTML=lines.map(t=>`<div class="vn-line">${vnLineHTML(t,0)}</div>`).join("");
  const els=Array.prototype.slice.call(host.children);
  // 두 조각(읽은 쪽·안 읽은 쪽)은 처음 한 번만 만들고, 이후엔 그 안의 글자만 바꾼다.
  // 예전엔 한 글자마다 innerHTML을 다시 넣어 줄 전체를 파싱하고 배치를 다시 계산했다.
  const pair=els.map(el=>[el.querySelector(".vn-on"),el.querySelector(".vn-off")]);
  let li=0, ci=0;
  vnTyping=true; vnHintText();
  const step=()=>{
    if(li>=lines.length){ vnTyping=false; vnHintText(); return; }
    const txt=lines[li], el=els[li], [on,off]=pair[li];
    if(ci===0) el.classList.add("typing");
    if(ci>=txt.length){ el.classList.remove("typing"); li++; ci=0; vnTimer=setTimeout(step,360); return; }
    const ch=txt.charAt(ci); ci++;
    on.textContent=txt.slice(0,ci); off.textContent=txt.slice(ci);
    if(ci%3===0) vnBlip(who);
    vnTimer=setTimeout(step, ".…—?!,".indexOf(ch)>=0 ? 165 : 34);
  };
  clearTimeout(vnTimer); step();
}
function vnHintText(){
  $("vnHint").textContent = vnTyping ? "탭하면 전체 표시"
    : (vnAt>=vnCuts.length-1 ? "탭하면 시작합니다" : "화면을 탭하면 다음");
}
/* 탭 한 번은 "지금 찍는 글자 전부 표시", 그다음 탭이 다음 컷 */
function vnAdvance(){
  if(vnTyping){
    clearTimeout(vnTimer); vnTyping=false;
    const cut=vnCuts[vnAt]||{};
    $("vnLines").innerHTML=(cut.lines||[]).map(l=>
      `<div class="vn-line">${vnLineHTML(l,l.length)}</div>`).join("");
    vnHintText(); return;
  }
  if(vnAt>=vnCuts.length-1){ vnClose(); return; }
  vnAt++; vnRender();
}
function vnClose(){
  clearTimeout(vnTimer); vnTyping=false;
  $("vn").classList.remove("on");
  vnMarkSeen();
}
/* 오프닝을 트는 화면인가 — 호스트 화면이거나, 호스트를 아무도 안 잡은 방이면 그 화면이 곧 보드다.
   isHost만 보면 호스트를 claim하지 않은 방에서는 아무에게도 오프닝이 안 뜬다. */

/* 배치도 SVG는 한 번만 받아 캐시한다. <img>가 아니라 인라인이어야
   텍스트를 숨기거나(레이아웃만) 포드를 감출 수 있다. */
let MAPSVG;
async function loadMapSVG(){
  if(MAPSVG!==undefined) return MAPSVG;
  const sid=(STATE&&STATE.scenarioId)||"";
  try{ const r=await fetch(`/assets/${sid}_map.svg`); MAPSVG = r.ok ? await r.text() : ""; }
  catch(e){ MAPSVG=""; }

function mapHTML(svg,cls){ return svg?`<div class="mapwrap ${cls||""}">${svg}</div>`:""; }
/* 같은 배치도를 두 군데(바깥 지도 + 구역 안 약식 지도)에 동시에 얹으면 id가 겹친다.
   약식 쪽 id에 m- 을 붙여 갈라놓는다 — clip-path 참조까지 같이 옮겨야 한다. */
function miniSVG(txt){
  return txt.replace(/\bid="([^"]+)"/g,'id="m-$1"').replace(/url\(#([^)]+)\)/g,'url(#m-$1)');
}

/* 구역 안으로 들어간다 — 그 자리에서 볼 수 있는 곳들이 나온다 */
function openZone(loc){
  const z=((SCEN.map)||[]).find(x=>x.loc===loc)||{loc,name:loc};
  const cards=zoneCards(loc);
  const done=cards.filter(c=>{ const k=cardState(c).k; return k!=="open"&&k!=="lock"; }).length;

let mz={s:1,x:0,y:0};
async function openMapDetail(){
  const svg=await loadMapSVG();
  if(!svg){ banner("배치도를 불러오지 못했습니다"); return; }
  mz={s:1,x:0,y:0};
  $("mapBox").innerHTML=`<div class="mhead">

    <div class="mfoot"><span class="mf-note" id="mzPct">100%</span>
      <button class="btn sm" onclick="mzZoom(-1)">－</button>
      <button class="btn sm" onclick="mzZoom(1)">＋</button>
      <button class="btn sm" onclick="mzReset()">처음으로</button>
      <button class="btn" onclick="closeModal('mapModal')">닫기</button></div>`;
  $("mapBox").style.setProperty("--mt","var(--cold)");
  openModal("mapModal"); wireZoom();

function mzApply(){ const v=$("mvp"); if(!v) return;
  v.style.transform=`translate(${mz.x}px,${mz.y}px) scale(${mz.s})`;
  const pct=$("mzPct"); if(pct) pct.textContent=Math.round(mz.s*100)+"%"; }
function mzZoom(dir,cx,cy){
  const box=$("mzoom"); if(!box) return;
  const r=box.getBoundingClientRect();
  const px=(cx==null?r.width/2:cx-r.left), py=(cy==null?r.height/2:cy-r.top);
  const ns=Math.max(1,Math.min(5,mz.s*(dir>0?1.25:1/1.25)));
  mz.x=px-(px-mz.x)*(ns/mz.s); mz.y=py-(py-mz.y)*(ns/mz.s); mz.s=ns;
  if(mz.s===1){ mz.x=0; mz.y=0; } mzApply(); }
function mzReset(){ mz={s:1,x:0,y:0}; mzApply(); }
function wireZoom(){
  const box=$("mzoom"); if(!box) return;
  const pts=new Map(); let last=0, from=null;
  box.addEventListener("pointerdown",e=>{ box.setPointerCapture(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY}); box.classList.add("drag");
    if(pts.size===2){ const [a,b]=[...pts.values()]; last=Math.hypot(a.x-b.x,a.y-b.y); from=mz.s; } });
  box.addEventListener("pointermove",e=>{
    const prev=pts.get(e.pointerId); if(!prev) return;
    const dx=e.clientX-prev.x, dy=e.clientY-prev.y;
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y);
      if(last>0){ const r=box.getBoundingClientRect();
        const ns=Math.max(1,Math.min(5,from*(d/last)));
        const cx=(a.x+b.x)/2-r.left, cy=(a.y+b.y)/2-r.top;
        mz.x=cx-(cx-mz.x)*(ns/mz.s); mz.y=cy-(cy-mz.y)*(ns/mz.s); mz.s=ns;
        if(mz.s===1){ mz.x=0; mz.y=0; } mzApply(); } }
    else if(mz.s>1){ mz.x+=dx; mz.y+=dy; mzApply(); } });
  const end=e=>{ pts.delete(e.pointerId); if(pts.size<2) last=0;
    if(!pts.size) box.classList.remove("drag"); };
  box.addEventListener("pointerup",end); box.addEventListener("pointercancel",end);
  box.addEventListener("wheel",e=>{ e.preventDefault(); mzZoom(e.deltaY<0?1:-1,e.clientX,e.clientY); },{passive:false});
}


function portraitHTML(c){
  // 규약: /assets/{시나리오}_portrait_{배역}.{webp|png}
  // webp가 없으면 png로, 그것도 없으면 스스로 지워져 이모지가 드러난다.
  const sid=(STATE&&STATE.scenarioId)||"";
  const src=sid?`/assets/${sid}_portrait_${c.id}.webp`:"";
  const png=sid?`/assets/${sid}_portrait_${c.id}.png`:"";
  // 이모지를 뒤에 깔지 않는다 — 다시 그릴 때마다 사진이 로드되는 사이에 비쳐서 깜빡여 보였다.
  // 사진을 끝내 못 찾은 경우에만 .por의 data-emo가 CSS로 드러난다.
  if(!src) return "";
  return `<img class="pt" src="${src}" alt="" decoding="async"
    onerror="if(this.dataset.f){this.closest('.por').classList.add('noimg');this.remove()}else{this.dataset.f=1;this.src='${png}'}">`;
}
/* 1.5초마다 폴링하는데 그때마다 그리드를 통째로 다시 그리면 <img>가 새로 만들어져
   인물 사진이 깜빡인다. 로비에 실제로 영향을 주는 값만 뽑아 비교하고,
   달라진 게 없으면 손대지 않는다. */
function roleCardState(c){
  const r=(STATE.roles||{})[c.id]||{}; const mine=myRoleId===c.id;
  const otherHuman=!mine&&r.mode==="human";
  const locked=!!(STATE&&STATE.started);
  // 카드의 버튼은 '고르는 일'만 한다. 내 정보 보기는 아래 바에 따로 있다.
  let badge="", btn="";
  if(mine){ badge=`<span class="badge me">● 나</span>`; btn=`<span class="rc-go done">✓ 선택함</span>`; }
  else if(otherHuman){ badge=`<span class="badge hu">사람</span>`; btn=`<span class="rc-go off">참여 중</span>`; }
  else if(r.mode==="ai"){ badge=`<span class="badge ai">AI</span>`;
    btn=locked?`<span class="rc-go off">AI</span>`:`<button class="rc-go" onclick="setAI('${c.id}')">AI 해제</button>`; }
  else { btn=locked?`<span class="rc-go off">-</span>`:`<button class="rc-go pick" onclick="claim('${c.id}')">선택</button>`; }
  return {cls:"rc"+(mine?" mine":"")+(otherHuman?" off":""), badge, btn};
}

/* ===== GM 마킹 보드 (페이즈 구동 · 시네마틱) ===== */
let gmSig=null, gmSeenMarks=null;
function renderGM(_force){
  const ph=STATE.phase||{}; const cur=STATE.round||0; const ap=ph.ap||0; const k=ph.key;
  $("gmPhase").textContent=(ph.name||"")+(cur?` · R${cur}`:"")+(ap?` · 인당 ${ap}장`:"");
  $("gmAdvBtn").style.display=(STATE.seq>=9)?"none":"";
  const checked=STATE.checked||{}; const used=STATE.usedAP||{};
  // 새로 마킹된 칸(플레이어가 방금 조사) 감지 → 펄스 1회
  const curMarks=new Set(); Object.entries(checked).forEach(([r,ids])=>ids.forEach(id=>curMarks.add(r+":"+id)));
  let fresh=new Set();
  if(gmSeenMarks===null) gmSeenMarks=curMarks; else { curMarks.forEach(m=>{ if(!gmSeenMarks.has(m))fresh.add(m); }); gmSeenMarks=curMarks; }
  // 시그니처가 같으면 다시 그리지 않음(시네마틱 재생·매트릭스 깜빡임 방지)
  const sig=k+"|"+STATE.seq+"|"+cur+"|"+JSON.stringify(checked)+"|"+JSON.stringify(used);
  if(sig!==gmSig||fresh.size){ gmSig=sig; $("gmWrap").innerHTML=buildGMBody(ph,cur,ap,k,checked,used,fresh); }
  renderChat("gmChat");
  updateAiSelect();
  // API 백엔드가 켜져 있으면 AI 자동발언 버튼, 아니면 수동 릴레이(입력창)
  const trig=$("gmAiTrig");
  const ais=SCEN.characters.filter(c=>(STATE.roles[c.id]||{}).mode==="ai");
  if(backendOn()&&ais.length){
    trig.style.display="flex";
    const chatOn=((STATE.chat||{}).on!==false);
    trig.innerHTML=
      `<span class="aichip" style="--sc:${chatOn?"var(--good)":"var(--muted)"}" onclick="toggleChat()" title="AI끼리 알아서 떠들게 둘지">`+
        `<span class="d" style="background:${chatOn?"var(--good)":"var(--muted)"}"></span>${chatOn?"자율대화 켬":"자율대화 끔"}</span>`+
      `<span class="aichip" style="--sc:var(--ember-b)" onclick="aiReact()"><span class="d" style="background:var(--ember-b)"></span>지금 한마디</span>`+
      `<span class="lb">지목</span>`+
      ais.map(c=>`<span class="aichip" style="--sc:${c.color}" onclick="aiSay('${c.id}')"><span class="d"></span>${esc(c.name)}</span>`).join("")+
      ((STATE.phase||{}).key==="final"?ais.map(c=>!(STATE.grades||{})[c.id]?`<span class="aichip" style="--sc:${c.color}" onclick="aiFinal('${c.id}')"><span class="d"></span>${esc(c.name)} 답변</span>`:"").join(""):"");
  } else trig.style.display="none";
}
function buildGMBody(ph,cur,ap,k,checked,used,fresh){
  const inter=(SCEN.interludes||{})[String(ph.seq)]||"";
  if(k==="open") return gmCinematic("막이 오른다 · 공통지문 낭독", (SCEN.intro||""), SCEN.victim,
    `<button class="btn gold" onclick="replayVN()">🎬 오프닝 비주얼노벨 재생</button>
     <div style="margin-top:8px">큰 화면에 띄워 다 같이 보세요. 끝나면 각자 <b>내 정보</b>로 자기소개를 나눈 뒤,
     <b>다음 페이즈 ›</b>로 <b>조사 R1</b>을 여세요.</div>`);
  if(k==="final"){
    // 답이 어디로 가는지가 곧 진행석이 있다는 뜻이다 — 여기로 모아 펼쳐 보여준다.
    // 답안 자체는 GM 키가 있어야 읽히므로(서버가 그렇게 잠가 뒀다) 따로 불러온다.
    setTimeout(loadGMFinalAnswers,0);

      `각자 자기 기기에서 서술로 답합니다. 답은 이 진행석으로 모입니다.
       <div class="gm-ans" id="gmAnswers"><div class="gm-note">답안을 불러오는 중…</div></div>`);
  }
  if(k==="reveal") return gmCinematic("진상 공개", (STATE.ending?STATE.ending.desc:"채점이 끝나면 엔딩이 열립니다."), (STATE.ending?("— "+STATE.ending.name):""),
    "이 세션이 진상과 엔딩을 전해주면, 낭독으로 밤을 닫으세요.");
  // invest / talk → 공용 카드 한 벌. 같은 카드가 인물 수만큼 반복되던 매트릭스를 걷어냈다 —
  // 조사카드는 한 사람만 가져갈 수 있으니, 카드는 한 장씩만 있고 '누가 가져갔나'를 표시하면 된다.
  const cat=(SCEN.cardCatalog||[]).filter(c=>c.round<=cur);
  const holder={};                       // cardId -> roleId
  Object.keys(checked||{}).forEach(rid=>(checked[rid]||[]).forEach(id=>{ holder[id]=rid; }));
  const target=gmMarkTarget();           // 지금 마킹할 인물
  const pubById={}; (STATE.revealed||[]).forEach(c=>{ pubById[c.id]=c; });

  let h=`<div class="gm-guide"><span class="g">GM 지문</span>${esc(ph.gm||"")}${inter?`<div class="il">📢 “${esc(inter)}”</div>`:""}</div>`;
  if(k==="invest"){
    h+=gmTurnBar();
    h+=`<div class="gm-note">카드는 <b>한 장씩</b>만 있습니다. 누군가 조사하면 그 카드에 이름이 붙고 남은 사람은 못 가져갑니다.
      <b>AI 차례</b>면 <b>🤖 자동 조사</b>를 누르세요. 사람 차례면 그 사람이 고른 카드를 눌러 마킹하고 <b>다음 차례 ›</b>.
      다시 누르면 해제 — 카드 <b>내용은 진행자에게 보이지 않습니다</b>.</div>`;
  } else {
    h+=`<div class="gm-note">토론 페이즈 — 새로 조사할 카드는 없습니다. 아래는 지금까지의 조사 현황입니다.</div>`;
  }

  // 마킹 대상 — 조사 페이즈면 차례인 사람이 기본값이다
  h+=`<div class="gm-pick"><span class="pl">마킹 대상</span>${SCEN.characters.map(c=>{
      const u=used[c.id]||0, full=ap>0&&u>=ap;
      return `<button class="pk${c.id===target?" on":""}${full?" full":""}" style="--pc:${c.color}"
        onclick="setGmTarget('${c.id}')">${c.avatar} ${esc(c.name)}
        <span class="n">${(checked[c.id]||[]).length}</span></button>`;
    }).join("")}</div>`;

  h+=`<div class="gm-legend"><span><b style="background:var(--panel2)"></b>미조사</span>
    <span><b style="background:linear-gradient(150deg,#3a2c12,#6a5320)"></b>조사됨 — 이름 표시</span></div>`;

  // 구역별로 카드 한 벌
  const zones=(SCEN.map&&SCEN.map.length)?SCEN.map:[...new Set(cat.map(c=>c.loc))].map(l=>({loc:l,name:l}));
  zones.forEach(z=>{
    const cards=cat.filter(c=>c.loc===z.loc);
    if(!cards.length) return;
    const cc=cards.map(cd=>{
      const rid=holder[cd.id]; const who=rid?(roleById(rid)||{}):null;
      const jm=fresh&&rid&&fresh.has(rid+":"+cd.id);
      const tip=`${esc(cd.locName)}${cd.spot?" · "+esc(cd.spot):""} · R${cd.round}${cd.requires?" · "+cd.requires+" 선행":""}`;
      const isPub=!!pubById[cd.id];
      if(who||isPub){
        // 토론 중엔 클릭으로 마킹이 풀리지 않는다 — 공개된 카드면 내용을 열고, 아니면 아무 일도 없다.
        const act=isPub?`openCard('${cd.id}')`:(k==="invest"?`gmMark('${rid}','${cd.id}')`:`gmHeld()`);
        return `<div class="gcell took${isPub?" pub":""}${jm?" justmark":""}" style="--cc:${(who&&who.color)||'var(--gold)'}"
          onclick="${act}" title="${tip}">
          <div class="cid">${esc(cd.spot||cd.locName)}${isPub?`<span class="pubtag">전체공개</span>`:""}</div>
          ${who?`<div class="cwho">${who.avatar} ${esc(who.name)}</div>`:`<div class="cwho">공개됨</div>`}
          ${isPub?`<div class="cspot">${esc(pubById[cd.id].title)}</div>`:""}</div>`;
      }
      return `<div class="gcell${target?"":" nopick"}" onclick="gmMarkHere('${cd.id}')" title="${tip}">
        <div class="cid">${esc(cd.spot||cd.locName||"")}</div>
        ${cd.requires?`<span class="rq">${cd.requires}▶</span>`:""}</div>`;
    }).join("");
    h+=`<div class="gm-zone"><div class="zh">${z.icon||"📍"} ${esc(z.name||z.loc)}
      <span class="zn">${cards.filter(c=>holder[c.id]).length}/${cards.length}</span></div>
      <div class="gcells">${cc}</div></div>`;
  });
  return h;
}
/* 진행석의 답안 모음 — /api/gm 은 GM 키로 잠겨 있고, 그 키는 진행석만 갖고 있다.
   서버는 그대로 두고 이미 있는 창구를 읽기만 한다. */
async function loadGMFinalAnswers(){

  const fa=d.finalAnswers||{}; const qs=SCEN.finalQuestions||[];

  if(!ids.length){ box.innerHTML=`<div class="gm-note">아직 들어온 답안이 없습니다. 각자 제출하면 여기에 쌓입니다.</div>`; return; }
  box.innerHTML=ids.map(id=>{ const c=roleById(id)||{}; const a=fa[id]||[];
    return `<div class="gm-a" style="--ac:${c.color||"var(--gold)"}">

      ${qs.map((q,i)=>`<div class="aq">${i+1}. ${esc(q)}</div><div class="ab">${esc((a[i]||"").trim()||"(무응답)")}</div>`).join("")}
    </div>`; }).join("")
    +`<div class="gm-note" style="margin-top:10px">${ids.length}명 제출 / 사람 배역 ${Object.keys(STATE.roles||{}).filter(r=>(STATE.roles[r]||{}).mode==="human").length}명</div>`;

function gmCinematic(kick, body, tail, note){
  const lines=String(body||"").split("\n").filter(x=>x.trim());
  let h=`<div class="gm-cine"><div class="ck">${esc(kick)}</div>`;
  lines.forEach((ln,i)=>{ h+=`<div class="ln serif" style="animation-delay:${(i*0.55).toFixed(2)}s">${esc(ln)}</div>`; });
  let d=lines.length*0.55;
  if(tail) h+=`<div class="vic serif" style="animation-delay:${d.toFixed(2)}s">${esc(tail)}</div>`, d+=0.55;
  if(note) h+=`<div class="go" style="animation-delay:${d.toFixed(2)}s">${note}</div>`;
  return h+`</div>`;
}
function updateAiSelect(){
  const sel=$("gmAiRole"); const prev=sel.value;
  const ais=SCEN.characters.filter(c=>(STATE.roles[c.id]||{}).mode==="ai");
  const opts=ais.map(c=>`<option value="${c.id}">${c.avatar} ${esc(c.name)}</option>`).join("")||`<option value="">AI 배역 없음</option>`;
  const sig=ais.map(c=>c.id).join(",");
  if(sel.dataset.sig!==sig){ sel.innerHTML=opts; sel.dataset.sig=sig; if(prev&&ais.some(c=>c.id===prev))sel.value=prev; }
}
async function gmSay(){
  const sel=$("gmAiRole"); const inp=$("gmAiInput"); const role=sel.value; const t=inp.value.trim();
  if(!role){ gmBanner("AI 배역이 없습니다 (빈자리를 로비에서 ‘AI로’ 지정하세요)"); return; }
  if(!t)return;
  const r=await post("/api/agent/say",{roleId:role,text:t,key:gmKey});
  if(r&&r.error){ gmBanner(r.error==="key"?"GM 키가 올바르지 않습니다 — AI 대사 전송에도 AGENT_KEY가 필요합니다.":("전송 오류: "+r.error)); return; }
  inp.value=""; inp.style.height="auto"; gmBanner(""); await poll();
}
/* 마킹 대상 — 조사 페이즈면 차례인 사람이 기본. 토론 중엔 직접 고른다. */
let gmTarget=null;

}

function gmHeld(){ gmBanner("토론 중에는 마킹을 바꾸지 않습니다 — 조사 페이즈에서 고치세요"); }
async function gmMarkHere(cardId){

/* 배역을 맡아도 바로 입장시키지 않는다 — 카드 전체가 탭 영역이라 오탭 비용이 크고,
   무엇보다 들어가기 전에 '내 정보'를 읽을 기회를 줘야 한다. 입장은 하단 액션바에서. */
async function claim(id){ const r=await post("/api/claim",{roleId:id,clientId}); if(r&&r.error){banner(r.error);return;} await setMy(id); }
async function claimRandom(){ const r=await post("/api/claim-random",{clientId}); if(r&&r.error){banner(r.error);return;} if(r&&r.roleId){ await setMy(r.roleId); } }
async function setMy(id){ myRoleId=id; localStorage.setItem("pmb.role",id); await poll(); }
async function releaseRole(){ if(myRoleId){ await post("/api/release",{roleId:myRoleId,clientId}); myRoleId=null; localStorage.removeItem("pmb.role"); await poll(); } }
async function setAI(id){ const r=await post("/api/setai",{roleId:id,clientId}); if(r&&r.error)banner(r.error); await poll(); }
async function resetRoom(){
  if(!confirm("방을 초기화할까요?\n\n배역과 조사 기록이 모두 지워지고 배역 선택으로 돌아갑니다.")) return;
  // clientId를 실어야 호스트로 인정된다. 안 보내면 403인데 예전엔 조용히 삼켰다.
  const r=await post("/api/reset",{clientId,key:gmKey});
  if(r&&r.error){ banner(r.error==="host"?"호스트만 방을 초기화할 수 있습니다":"초기화 실패: "+r.error); return; }
  await post("/api/host/claim",{clientId});   // 초기화가 호스트를 풀었으니 곧바로 되잡는다
  myRoleId=null; localStorage.removeItem("pmb.role");
  Object.keys(localStorage).filter(k=>k.indexOf("pmb.final.")===0).forEach(k=>localStorage.removeItem(k));
  lobbyBuilt=""; handSeen=null; myHand=[];    // 뼈대를 다시 세워야 새 방이 그대로 그려진다
  banner(""); await poll(); go("lobby");
}

/* 알리바이 대화록 — 오프닝이 끝난 직후, «그 시간에 어디 있었는지»를 한 바퀴 돌린 기록.

/* 페이즈 패널 */
function renderPanel(ph){
  const p=$("ppanel"); const k=ph.key;
  // 매 폴링마다 통째로 다시 그리면 방 카드 애니메이션이 계속 재생돼 '깜빡임'이 생긴다.
  // 실제로 바뀐 게 있을 때만 다시 그린다.
  const sig=JSON.stringify([k,STATE.seq,STATE.round,STATE.turn,ph.ap,myRoleId,myHand.map(c=>c.id),STATE.revealedIds,STATE.usedAP,STATE.grades,STATE.ending&&STATE.ending.name,STATE.interrogate,STATE.checked,STATE.crisis&&[STATE.crisis.open,STATE.crisis.solved,STATE.crisis.answered],crAns.join(""),STATE.flood]);
  if(sig===renderPanel._sig) return;
  renderPanel._sig=sig;
  if(k==="open"){
    const lines=String(SCEN.intro||"").split("\n").filter(x=>x.trim());
    const chunks=[]; for(let i=0;i<lines.length;i+=2) chunks.push(lines.slice(i,i+2).join("\n"));
    const introHTML=chunks.map((c,i)=>`<p class="cine-p" style="animation-delay:${(i*0.9+0.15).toFixed(2)}s">${esc(c).replace(/\n/g,"<br>")}</p>`).join("");
    p.innerHTML=`<div class="card"><div class="clue-h"><h2 style="margin:0">사건 · 공통지문</h2><button class="btn sm" onclick="replayVN()">🎬 오프닝 보기</button></div><div class="cine-intro">${introHTML}</div></div>
    <div class="card"><h2>피해자</h2><div class="panel-note">${esc(SCEN.victim||"")}</div></div>
    ${alibiHTML()}
    <div class="panel-note" style="text-align:center">각자 <b>내 정보</b>를 확인하고, 아래 대화창에서 배역으로 자기소개를 나누세요.</div>`;
    // 오프닝은 GM 보드(호스트 화면)에서만 재생한다 — 16:9 큰 화면에 띄워 다 같이 보는 연출이라,
    // 각자 폰에서 따로 돌면 소리가 겹치고 진행이 흩어진다.
  }
  else if(k==="invest"){ const ap=ph.ap||0; const u=(STATE.usedAP||{})[myRoleId]||0; const left=Math.max(0,ap-u); const apPill=myRoleValid()?`<span class="pill" style="color:${left>0?'var(--good)':'var(--ember-b)'}">이번 턴 조사 ${u}/${ap}</span>`:"";
    p.innerHTML=`${crisisHTML()}${handWarn()}${turnBar()}<div class="clue-h"><h3>조사 맵</h3>${apPill}<span class="pill" style="color:var(--gold-b)">내 손패 ${myHand.length}</span></div><div class="panel-note" style="margin-bottom:10px">${myRoleValid()?`내 차례에 <b>${ap}장</b>까지 조사할 수 있어요. 카드를 눌러 <b>조사</b>하면 <b>손패(비공개)</b>로 들어옵니다. 알아낸 것은 <b>대화로만</b> 공유하세요(감춰도 됩니다).`:`관전 중 — 배역을 맡아야 조사할 수 있어요.`}</div><div id="cmap"></div>`;
    renderMap($("cmap")); paintCrisisBoard(); }
  else if(k==="talk"){
    const mineIds=new Set(myHand.map(c=>c.id));
    const pubc=(STATE.revealed||[]).filter(c=>!mineIds.has(c.id));
    const hcards=(myRoleValid()?myHand:[]).map(c=>({...c,_pub:false})).concat(pubc.map(c=>({...c,_pub:true})));
    p.innerHTML=`${handWarn()}<div class="clue-h"><h3>토론</h3><span class="pill" style="color:var(--gold-b)">내 손패 ${myHand.length}</span>${pubc.length?`<span class="pill" style="color:var(--cold)">전체공개 ${pubc.length}</span>`:""}</div><div class="panel-note">아래 대화창에서 서로를 취조하세요. <b>내 손패</b>는 알릴지 감출지 자유고, <b>전체공개</b> 카드는 이미 모두가 보고 있습니다.</div>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:7px">${hcards.map(c=>`<div class="card" style="margin:0;padding:10px 12px;border-color:${c._pub?"#2f4a5c":"#5a4a2c"};background:${c._pub?"linear-gradient(160deg,#141d24,#111319)":"linear-gradient(160deg,#221c14,#151413)"};cursor:pointer" onclick="showMyHand()"><span class="pill" style="color:${c._pub?"var(--cold)":"var(--gold-b)"}">${c._pub?"전체공개":"내 손패"}</span> <b style="color:${c._pub?"var(--cold)":"var(--gold-b)"}">${esc(c.title)}</b> <span class="pill">${esc(c.locName)}${c.spot?"·"+esc(c.spot):""}·R${c.round}</span><div class="lead" style="margin:4px 0 0;font-size:12.5px">${esc(c.text)}</div></div>`).join("")||'<div class="panel-note">아직 조사한 단서가 없어요. (조사 페이즈에 카드를 여세요.)</div>'}</div>`
    +interrogPanelHTML(); }
  else if(k==="final"){ renderFinal(p); }

let handSeen=null;
/* 카드 한 장의 상태 — 지도·구역·대시보드가 같은 판단을 쓴다 */
function cardState(c){
  const pub={}; (STATE.revealed||[]).forEach(x=>pub[x.id]=x);
  const hand={}; myHand.forEach(x=>hand[x.id]=x);
  if(pub[c.id])  return {k:"pub",  label:"전체공개", act:`openCard('${c.id}')`};
  if(hand[c.id]) return {k:"hand", label:"내 손패",  act:`openCard('${c.id}')`};
  const taker=Object.keys(STATE.checked||{}).find(rid=>rid!==myRoleId&&(STATE.checked[rid]||[]).includes(c.id));
  if(taker){ const tc=roleById(taker)||{}; return {k:"taken", label:(tc.name||"")+" 조사함", who:tc, act:""}; }
  const cr=STATE.round||0;
  const allIds=new Set(STATE.revealedIds||[]);
  Object.values(STATE.checked||{}).forEach(a=>(a||[]).forEach(x=>allIds.add(x)));
  const reqOk=!c.requires||allIds.has(c.requires), roundOk=c.round<=cr;
  const ap=(STATE.phase||{}).ap||0, used=(STATE.usedAP||{})[myRoleId]||0;
  const apOut=myRoleValid()&&ap>0&&used>=ap;
  const turn=STATE.turn, myTurn=(!turn)||turn===myRoleId;
  if(sealedLoc(c.loc)) return {k:"lock", label:"물에 잠김", act:""};
  // ap 가 0인 페이즈(토론·종막)에도 지도를 열어볼 수 있게 되면서, 눌러봤자 서버가 막는
  // '조사하기'가 뜨는 자리가 생겼다. 그럴 땐 아예 누를 수 없게 두고 언제 열리는지만 말한다.
  if(roundOk&&reqOk&&myRoleValid()&&ap>0&&!apOut&&myTurn) return {k:"open", label:"조사하기", act:`investigate('${c.id}')`};

function sealedLoc(loc){ return ((STATE&&STATE.sealed)||[]).indexOf(loc)>=0; }
/* 그 구역에서 지금 볼 수 있는 카드 */
function zoneCards(loc){
  const cr=STATE.round||0;
  const pub=new Set((STATE.revealed||[]).map(c=>c.id)); const hand=new Set(myHand.map(c=>c.id));
  return SCEN.cardCatalog.filter(c=>c.loc===loc && (c.round<=cr || pub.has(c.id) || hand.has(c.id)));
}
/* 구역 점 표시 — 시나리오 선택창의 사람표시와 같은 읽는 법. 채워진 점 = 이미 누가 꺼낸 카드 */
function zonePips(loc){
  const cards=zoneCards(loc);
  const done=cards.filter(c=>{ const k=cardState(c).k; return k!=="open"&&k!=="lock"; }).length;
  const dots=cards.map(c=>{ const k=cardState(c).k;
    return `<span class="zp ${k}"></span>`; }).join("");
  return {cards, done, html:`<span class="zpips">${dots}</span><b>${done}/${cards.length}</b>`};
}

function paintFlood(svg){

async function paintMap(){

/* 배치도의 구역이 곧 버튼이다. 개수는 SVG가 이미 갖고 있는 자리(#cnt-X)에 채워 넣는다 —
   글자를 새로 만들어 얹으면 지도를 고칠 때마다 자리가 어긋난다. */
function wireZones(svg){
  ((SCEN.map)||[]).forEach(z=>{
    const g=svg.querySelector("#zone-"+z.loc); if(!g) return;
    const p=zonePips(z.loc);
    const cnt=svg.querySelector("#cnt-"+z.loc);
    if(cnt) cnt.textContent=`${p.done}/${p.cards.length}`;
    if(sealedLoc(z.loc)){ g.classList.add("z-sealed");
      if(cnt) cnt.textContent="잠김"; return; }
    if(!p.cards.length){ g.classList.add("z-empty"); return; }
    g.classList.add("z-live");
    if(p.done>=p.cards.length) g.classList.add("z-done");
    g.addEventListener("click",()=>openZone(z.loc));
  });
}
/* 제목·본문이 실린 판본. SCEN.cardCatalog 에는 슬롯 구조만 오고 제목·본문은 아예 실려
   오지 않는다(그게 서버가 스포일러를 막는 방식이다). 그래서 읽을 것이 있는 카드는

function dashCard(c){

  if(st.k==="hand") return `<button class="dc mine act" onclick="openCard('${c.id}')">
    <span class="sp">${spot}</span><span class="ti">${esc((full&&full.title)||"")}</span>
    <span class="wh"><i>🃏</i>내 손패 · 비공개</span></button>`;
  if(st.k==="taken"){ const w=st.who||{};
    // 남이 쥔 카드는 임자만 말한다 — 제목이 새면 그 사람이 감출 것이 없어진다
    return `<div class="dc held" style="--wc:${w.color||"var(--line)"}">
      <span class="sp">${spot}</span>
      <span class="wh"><i>${w.avatar||"❔"}</i>${esc(w.name||"")} 쥐고 있음</span></div>`; }
  // cardState 의 잠김 사유에는 '내 차례 아님'처럼 내 사정이 섞여 있다. 현황판은 판 전체를
  // 읽는 자리라 카드 쪽 사정만 적는다 — 나머지는 그냥 아직 아무도 안 본 카드다.

  return `<div class="dc none${dim?" lock":""}">

}

/* 심문 팝업 — 예전엔 패널에 인물×카드가 전부 늘어서 있어서, 누굴 몇 번 찔렀는지 세기도
   어렵고 들이밀 카드를 고르기도 번거로웠다. 한 창 안에서 한 걸음씩 밟게 한다:
   대상 → 무엇을 캐물을지 → 들이밀 카드(맨손 가능) → 확인. 서버 계약은 그대로다 —
   /api/interrogate 는 대상이 '지금 쥐고 있는 카드'를 요구하므로 그 걸음을 뺄 수 없다.
   쥔 카드가 한 장뿐이면 그 걸음은 건너뛴다. */
let igW={step:"who",target:null,card:null,evidence:"",busy:false,result:null};
function openInterrog(){
  igW={step:"who",target:null,card:null,evidence:"",busy:false,result:null};
  $("interrogBox").style.setProperty("--mt","var(--ember)");
  igRender(); openModal("interrogModal");
}
function igPickWho(id){
  const cards=heldCardsOf(id);
  igW.target=id;
  // 쥔 게 한 장이면 고를 것이 없다 — 묻지 않고 바로 증거로 넘어간다
  if(cards.length===1){ igW.card=cards[0].id; igW.step="ev"; } else { igW.card=null; igW.step="what"; }
  igRender();
}
function igPickWhat(id){ igW.card=id; igW.step="ev"; igRender(); }
function igPickEv(id){ igW.evidence=id; igW.step="ok"; igRender(); }
function igBack(){ igW.step=(igW.step==="ok")?"ev":(igW.step==="ev"?(heldCardsOf(igW.target).length>1?"what":"who"):"who"); igRender(); }
function igRender(){
  const ig=STATE.interrogate||{};
  const tc=igW.target?(roleById(igW.target)||{}):null;
  const cd=igW.card?(cardCat(igW.card)||{}):null;
  const evCard=igW.evidence?[...myHand,...(STATE.revealed||[])].find(e=>e.id===igW.evidence):null;
  const multi=igW.target&&heldCardsOf(igW.target).length>1;
  const steps=[["who","대상"],...(multi?[["what","무엇을"]]:[]),["ev","증거"],["ok","확인"]];
  const order=steps.map(s=>s[0]); const cur=order.indexOf(igW.step);
  const bar=`<div class="ig-step">${steps.map(([k,l],i)=>
    `${i?"<u>›</u>":""}<i class="${k===igW.step?"on":(i<cur?"done":"")}">${i+1} ${l}</i>`).join("")}</div>`;

  let body,foot;
  if(igW.result){
    const r=igW.result;
    const badge=r.outcome==="truth"?'<span class="pill" style="color:var(--ember-b)">🗣️ 실토</span>'
      :(r.outcome==="evasive"?'<span class="pill">🌀 얼버무림</span>':'<span class="pill" style="color:var(--cold)">💬 답변</span>');
    body=`<div class="ig-out ${r.outcome||"plain"}">${badge}<div class="ln">${esc(r.line||"")}</div></div>
      <div class="panel-note" style="margin-top:12px">같은 내용이 대화창에도 남았습니다 — 모두가 보고 있어요.</div>`;
    // 결과가 온 뒤에는 이 창에 다시 보낼 길을 아예 두지 않는다 — 닫기뿐이다
    foot=`<span class="mf-note">남은 심문 ${ig.remaining||0}회</span>
      <button class="btn" onclick="closeModal('interrogModal')">닫기</button>`;
  }
  else if(igW.step==="who"){
    const list=SCEN.characters.filter(c=>c.id!==myRoleId).map(c=>{ const n=heldCardsOf(c.id).length;
      return `<button class="ig-p" style="--pc:${c.color}" ${n?"":"disabled"} onclick="igPickWho('${c.id}')">
        <span class="av">${c.avatar||"❔"}</span><span><span class="nm">${esc(c.name)}</span>
        <span class="sub">${n?`쥔 카드 ${n}장`:"쥔 카드 없음"}</span></span></button>`; }).join("");
    body=bar+`<div class="mlead">누구를 붙잡을지 고르세요.</div><div class="ig-people">${list}</div>`;
    foot=`<button class="btn" onclick="closeModal('interrogModal')">취소</button>`;
  }
  else if(igW.step==="what"){
    const list=heldCardsOf(igW.target).map(c=>`<button class="ig-spot" onclick="igPickWhat('${c.id}')">
      ${esc(c.spot||c.locName)}<span class="sw">${esc(c.locName)} · R${c.round}</span></button>`).join("");
    body=bar+`<div class="mlead"><b style="color:${tc.color}">${esc(tc.name)}</b>이(가) 쥔 것 중 무엇을 캐물을까요. 제목은 아직 안 보입니다 — 어디서 나온 것인지만 압니다.</div>
      <div class="ig-spots">${list}</div>`;
    foot=`<button class="btn" onclick="igBack()">‹ 뒤로</button>`;
  }
  else if(igW.step==="ev"){
    const evid=[...myHand,...(STATE.revealed||[])];
    const mine=new Set(myHand.map(c=>c.id));
    body=bar+`<div class="mlead">들이밀 카드를 고르세요. <b>안 골라도 됩니다</b> — 다만 정확한 카드를 짚으면 반드시 실토하고, 엉뚱한 카드는 오히려 빌미가 됩니다.</div>
      <div class="ig-evlist">
        <button class="ig-ev bare ${igW.evidence===""?"on":""}" data-id="" onclick="igPickEv('')">카드 없이 추궁
          <span class="ew">맨손으로 캐묻습니다</span></button>
        ${evid.map(e=>`<button class="ig-ev ${igW.evidence===e.id?"on":""}" data-id="${e.id}" onclick="igPickEv('${e.id}')">${esc(e.title)}
          <span class="ew">${esc(e.locName)}${e.spot?" · "+esc(e.spot):""} · ${mine.has(e.id)?"내 손패":"전체공개"}</span></button>`).join("")}
      </div>`;
    foot=`<button class="btn" onclick="igBack()">‹ 뒤로</button>`;
  }
  else {
    body=bar+`<div class="ig-sum">
      <div class="r"><span class="k">누구를</span><span class="v" style="color:${tc.color}">${tc.avatar} ${esc(tc.name)}</span></div>
      <div class="r"><span class="k">무엇을</span><span class="v">${esc((cd&&(cd.spot||cd.locName))||"")}</span></div>
      <div class="r"><span class="k">증거</span><span class="v">${evCard?esc(evCard.title):"카드 없이 맨손"}</span></div></div>
      <div class="ig-warn">⚠ 보내면 심문 <b>1회</b>가 즉시 소모됩니다. 남은 횟수 ${ig.remaining||0}회 — 되돌릴 수 없어요.</div>`;
    foot=`<button class="btn" ${igW.busy?"disabled":""} onclick="igBack()">‹ 뒤로</button>
      <button class="btn ember" id="igGo" ${igW.busy?"disabled":""} onclick="submitInterrog()">${igW.busy?"보내는 중…":"추궁한다"}</button>`;
  }
  $("interrogBox").innerHTML=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">심층심문 · 남은 ${ig.remaining||0}회</span>
        <h2>${igW.result?"추궁 결과":(tc?`<span style="color:${tc.color}">${tc.avatar} ${esc(tc.name)}</span> 추궁`:"누구를 추궁할까")}</h2>
        ${cd?`<span class="mh-sub">${esc(cd.spot||cd.locName||"")}</span>`:""}</div>
      <button class="mh-x" onclick="closeModal('interrogModal')" aria-label="닫기">✕</button></div>
    <div class="mbody">${body}</div><div class="mfoot">${foot}</div>`;
}
async function submitInterrog(){
  // 잘못 눌러 연달아 나가면 두 번뿐인 기회가 한꺼번에 날아간다. 요청이 도는 동안 잠그고,
  // 결과가 온 뒤에도 다시 못 누르게 화면 자체를 바꾼다.
  if(igW.busy||igW.result) return;
  igW.busy=true; igRender();
  const r=await post("/api/interrogate",{askerRoleId:myRoleId,targetRoleId:igW.target,cardId:igW.card,evidenceCardId:igW.evidence,clientId});
  igW.busy=false;
  if(r&&r.error){ banner(r.error); igRender(); return; }
  banner(""); igW.result=r; igRender();
  await poll(); igRender();   // 폴이 끝나야 남은 횟수가 줄어든 값으로 바뀐다
}
/* ── 조사 턴 (하이브리드: 순번 강제 + 넘기기·AI 자동조사) ── */
function turnBar(){

  let act;
  if(mine&&myRoleValid()){ const left=Math.max(0,ap-((STATE.usedAP||{})[myRoleId]||0));
    act=`<div class="tb-act"><button class="btn gold" onclick="turnNext()">${left>0?`조사 그만하고 다음 차례 (${left}장 남음)`:'다음 차례로 ›'}</button></div>`;
  } else { act=`<div class="tb-wait">지금은 <b style="color:${now.color}">${esc(now.name||'')}</b> 차례예요 — 대화로 조사를 이끌어 주세요.</div>`; }

async function aiInvestigateNow(rid){ const r=await post("/api/ai-investigate",{roleId:rid||"",clientId,key:gmKey}); if(r&&r.error){gmBanner(r.error);return;} if(r&&r.picked){ const c=roleById(rid)||{}; gmBanner(`${c.name||'AI'} 자동 조사 — ${r.picked.map(p=>p.title).join(", ")||'열 카드 없음'}`);} await poll(); }

function cnote(c){ return c&&c.hint?`<div class="cnote"><b>해석</b>${esc(c.hint)}</div>`:""; }
/* 목적격 조사 — 받침이 있으면 '을', 없으면 '를' */
function objp(w){ if(!w) return "를"; const cd=w.charCodeAt(w.length-1);
  return (cd>=0xAC00&&cd<=0xD7A3&&(cd-0xAC00)%28)?"을":"를"; }
/* 조사하면 구역 팝업은 할 일을 다했다 — 닫고, 방금 뽑은 카드를 그 자리에 띄운다.
   예전엔 팝업이 남아 카드를 가려서, 뭘 뽑았는지 보려면 직접 닫고 손패를 열어야 했다. */
async function investigate(id){ const r=await post("/api/investigate",{cardId:id,roleId:myRoleId,clientId}); if(r&&r.error){banner(r.error);return;} banner(""); closeModal("mapModal"); await poll(); openCard(id); }

/* 종막 질문지 — 답안이 어디로 가는지가 세 갈래다.

      준다 — 그걸 들고 클로드 세션에 물어보면 그 자리가 진행석이 된다. */

  }

  h+=`</div>`;

function claudeHandoffText(){

  L.push("");

  L.push(SCEN.title||"");
  if(SCEN.subtitle) L.push(SCEN.subtitle);
  if(SCEN.victim) L.push("피해자 — "+SCEN.victim);
  L.push("");
  L.push("── 질문");
  qs.forEach((q,i)=>L.push(`${i+1}. ${q}`));
  L.push("");
  L.push("── 답안");

/* 채팅 */
/* 새로 온 줄만 덧붙인다. 예전엔 누가 한마디 할 때마다 대화창을 통째로 지우고
   전부 다시 그렸다 — 500줄쯤 쌓인 후반부엔 그 한 번이 80ms를 먹었고, 그게 말이
   오갈 때마다 모든 기기에서 동시에 일어났다. 서버가 줄마다 통 번호(n)를 준다. */
const CHAT_KEEP=220;                 // 화면에 남겨두는 최대 줄 수
let chatDrawn={};                    // 대화창 id -> 마지막으로 그린 줄 번호
function chatRow(m){
  if(m.kind==="system"){ const s=document.createElement("div"); s.className="sys"+(m.broadcast?" bc":""); s.textContent=m.text; return s; }
  if(m.kind==="interrogate"){ const s=document.createElement("div"); s.className="interrog "+(m.outcome||"plain");
    s.innerHTML=`<div class="ig-head">${esc(m.text)}</div><div class="ig-line">${esc(m.line||"")}</div>`; return s; }
  const c=roleById(m.roleId);
  const row=document.createElement("div"); row.className="msg"+(m.roleId===myRoleId?" own":"");
  row.innerHTML=`<div class="av">${c?c.avatar:"❔"}</div><div><div class="nm" style="color:${c?c.color:"#999"}">${esc(m.speaker)}${m.kind==="human"?'<span class="tag-me">사람</span>':''}</div><div class="bub">${esc(m.text)}</div></div>`;
  return row;
}
function renderChat(boxId){
  const id=boxId||"chat", box=$(id); if(!box) return;
  const rows=STATE.table||[];
  const near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  let last=chatDrawn[id];
  const first=rows.length?(rows[0].n||0):0, tail=rows.length?(rows[rows.length-1].n||0):-1;
  // 못 본 사이에 창이 밀려났거나(오래 떠나 있었다) 방이 초기화돼 번호가 되감겼으면 다시 그린다
  if(last===undefined||!rows.length||first>last+1||tail<last){ box.innerHTML=""; last=-1; }
  let added=0;
  const frag=document.createDocumentFragment();
  for(const m of rows){ const n=(m.n==null?0:m.n); if(n<=last) continue; frag.appendChild(chatRow(m)); last=n; added++; }
  if(added) box.appendChild(frag);
  chatDrawn[id]=last;
  while(box.children.length>CHAT_KEEP) box.removeChild(box.firstChild);
  if(near&&added) box.scrollTop=box.scrollHeight;
}

/* ── 스와이프 카드 캐러셀 (실물카드처럼 옆으로 넘겨보기) ── */
function buildSwipe(slides){
  const track=slides.map(s=>`<div class="sw-slide">${s}</div>`).join("");
  const dots=slides.map((_,i)=>`<span class="sw-dot${i===0?" on":""}" data-i="${i}"></span>`).join("");
  // 좌우 화살표를 카드 위에 겹쳐 띄우면 글이 길 때 본문을 가린다 — 카드 아래 컨트롤 줄에 둔다.
  const ctrls=slides.length>1?`<div class="sw-ctrl"><button class="sw-nav prev" aria-label="이전">‹</button><div class="sw-dots">${dots}</div><button class="sw-nav next" aria-label="다음">›</button></div><div class="sw-count"><b class="sw-cur">1</b> / ${slides.length} · 옆으로 넘겨보세요</div>`:"";
  return `<div class="swipe"><div class="sw-track">${track}</div>${ctrls}</div>`;
}
function wireSwipe(box){
  const sw=box.querySelector(".swipe"); if(!sw)return;
  const track=sw.querySelector(".sw-track"); const slides=[...sw.querySelectorAll(".sw-slide")];
  const dots=[...sw.querySelectorAll(".sw-dot")]; const prev=sw.querySelector(".sw-nav.prev"); const next=sw.querySelector(".sw-nav.next");
  const cur=()=>Math.round(track.scrollLeft/track.clientWidth);
  const upd=()=>{ const i=cur(); dots.forEach((d,j)=>d.classList.toggle("on",j===i)); const c=sw.querySelector(".sw-cur"); if(c)c.textContent=i+1; if(prev)prev.disabled=i<=0; if(next)next.disabled=i>=slides.length-1; };
  const goTo=i=>{ i=Math.max(0,Math.min(slides.length-1,i)); track.scrollTo({left:i*track.clientWidth,behavior:"smooth"}); };
  track.addEventListener("scroll",()=>{ clearTimeout(track._t); track._t=setTimeout(upd,60); },{passive:true});
  if(prev)prev.onclick=()=>goTo(cur()-1);
  if(next)next.onclick=()=>goTo(cur()+1);
  dots.forEach(d=>d.onclick=()=>goTo(+d.dataset.i));
  // 카드가 화면보다 길면 카드 안에서 굴린다. 아래 흐림('더 있어요')은 더 굴릴 게
  // 남았을 때만 켠다 — 끝까지 내렸는데도 흐리면 잘린 것으로 보인다.
  slides.forEach(sl=>{
    const card=sl.querySelector(".bigcard"); if(!card) return;
    const mark=()=>sl.classList.toggle("more", card.scrollHeight-card.scrollTop-card.clientHeight>8);
    card.addEventListener("scroll",mark,{passive:true});
    mark(); requestAnimationFrame(mark);         // 웹폰트가 늦게 오면 높이가 나중에 잡힌다
    if(document.fonts&&document.fonts.ready) document.fonts.ready.then(mark).catch(()=>{});
  });
  upd();
}

/* 내 정보(배역 시트) — 실물카드처럼 스와이프로 넘겨보기(큰 글씨) */
/* 어느 페이즈까지의 시트를 읽었는지. 배역별로 따로 센다 — 배역을 바꾸면 처음부터 다시 새 것이다. */

  if(s.error){ banner(s.error); return; }
  const curPhase=(STATE&&STATE.phase)?STATE.phase.name:"";
  const slides=[];
  // 1) 정체 슬라이드
  slides.push(`<div class="bigcard role" style="--rc:${s.color}">
    <div class="bc-eyebrow">나의 배역</div>
    <div class="bc-avwrap"><div class="bc-av">${s.avatar}</div><div><div class="bc-title role">${esc(s.name)}</div><div class="bc-sub">${esc(s.age?s.age+" · ":"")}${esc(s.job)}</div></div></div>

    ${s.hidden?`<div class="bc-hidden">⚑ 스포일러 배역 — 정체를 들키지 마세요</div>`:``}</div>`);
  // 2) 내가 아는 옛일 — 연표. 여섯 사람이 같은 9년을 다르게 기억하고, 비어 있는 칸도 저마다 다르다.
  if((s.past||[]).length){
    const rows=s.past.map((r,i,a)=>`<div class="tl-r${i===a.length-1?" last":""}">
      <div class="tl-w">${esc(r.w)}</div><div class="tl-t">${esc(r.t)}</div></div>`).join("");
    slides.push(`<div class="bigcard role" style="--rc:${s.color}">

      <div class="bc-title" style="font-size:18px">여기까지가 내가 아는 전부다</div>
      <div class="tl">${rows}</div></div>`);
  }
  // 3) 시트 항목 슬라이드 — 종류를 머리에 달아둔다. 여덟 장이 전부 '큐카드'면 지금 뭘 읽는지 알 수 없다.
  const KIND={now:"지금, 이 배에서",me:"나라는 사람",past:"지난 일",know:"나만 아는 것",
              secret:"들키면 안 되는 것",plan:"내가 하려는 것",alibi:"나의 알리바이",todo:"알아내야 할 것"};
  (s.sheet||[]).forEach(x=>{ slides.push(`<div class="bigcard role k-${x.k||"cue"}" style="--rc:${s.color}">
    <div class="bc-eyebrow">${esc(KIND[x.k]||"큐카드")}</div><div class="bc-title" style="font-size:18px">${esc(x.h)}</div>
    <div class="bc-body">${esc(x.b)}</div></div>`); });
  // 4) 떠오른 기억
  const frags=(s.fragments||[]);
  // 이 묶음의 이름은 시나리오가 정한다 — 망령은 기억을 되찾지만, 가라앉는 배의 사람들은
  // 잃은 기억이 없다. 거기서 늘어나는 건 이제 꺼내기로 한 말이다.
  const fragL=(SCEN&&SCEN.fragLabel)||"기억의 파편", fragE=(SCEN&&SCEN.fragEyebrow)||"떠오른 기억";
  if(frags.length){ const fh=frags.map((f,i,arr)=>{ const isNew=(f.when===curPhase&&i===arr.length-1); return `<div class="frag${isNew?" newfrag":""}"><div class="w">${esc(fragL)} · ${esc(f.when)}${isNew?" · NEW":""}</div>${esc(f.text)}</div>`; }).join("");
    slides.push(`<div class="bigcard role" style="--rc:${s.color}"><div class="bc-eyebrow">${esc(fragE)}</div><div class="bc-title" style="font-size:18px">${esc(fragL)}</div><div style="margin-top:14px">${fh}</div></div>`); }
  // 5) 배치도 — 전원이 갖는다. 포드는 아는 사람 지도에만 그려진다.
  if(s.hasMap){
    const svg=await loadMapSVG();
    if(svg) slides.push(`<div class="bigcard role" style="--rc:${s.color}">
      <div class="bc-eyebrow">${s.showPod?"너만 가진 판본":"배 안내도"}</div>
      <div class="bc-title" style="font-size:18px">이원록함 배치도</div>
      <div class="bc-body" style="margin-bottom:10px">${s.showPod
        ? "승선 전에 본 도면이다. <b>탈출 포드</b>까지 그려져 있다."
        : "승선할 때 받은 안내도다. 구획 배치와 통로만 그려져 있다."}</div>
      ${mapHTML(svg, s.showPod?"":"nopod")}
      ${s.showPod?`<div class="podwarn">⚠ 다른 사람의 지도에는 <b>포드가 없다.</b>
        이 화면을 보여주는 순간, 네가 알고 있었다는 게 드러난다.</div>`:""}</div>`);
  }
  // 6) 알고 있는 조사카드 — 내 소지품에서 나올 것들. 손에 쥐고 시작하는 게 아니라 내용만 안다.
  //    남보다 먼저 집어 덮을지, 그 턴을 남의 구역에 쓸지 고르라고 미리 보여주는 것이다.
  (s.knows||[]).forEach(c=>{
    slides.push(`<div class="bigcard role k-owncard" style="--rc:${s.color}">
      <div class="bc-eyebrow">알고 있는 조사카드 · 아직 아무도 안 봤다</div>
      <div class="bc-title" style="font-size:18px">${esc(c.title)}</div>
      <div class="bc-tags"><span class="pill">${esc(c.locName)}</span>${c.spot?`<span class="pill">${esc(c.spot)}</span>`:""}<span class="pill">R${c.round}</span></div>
      <div class="bc-body">${esc(c.text)}</div>
      <div class="knownote">네 물건이라 내용을 이미 안다. <b>조사해야 손패로 들어온다</b> —
        먼저 집어 덮을지, 그 턴을 다른 데 쓸지는 네가 정한다.</div></div>`);
  });
  // 7) 나의 목표
  slides.push(`<div class="bigcard role" style="--rc:${s.color}"><div class="bc-eyebrow">나의 목표</div><div class="bc-title" style="font-size:18px">이번 밤, 내가 노리는 것</div>
    <div style="margin-top:12px">${(s.goals||[]).map(g=>`<div class="bc-goal"><span>${esc(g.t)}</span><span class="pt">+${g.p}</span></div>`).join("")}</div></div>`);
  $("sheetBox").innerHTML=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">내 정보</span>
        <h2 style="color:${s.color}">${s.avatar} ${esc(s.name)}</h2>
        <span class="mh-sub">실물 카드처럼 옆으로 넘겨 확인하세요</span></div>
      <button class="mh-x" onclick="closeModal('sheetModal')" aria-label="닫기">✕</button></div>
    <div class="mbody">${buildSwipe(slides)}</div>
    <div class="mfoot"><button class="btn" onclick="closeModal('sheetModal')">확인</button></div>`;
  // 눈썹라벨과 머리 띠가 배역 키컬러로 든다 — 여섯 사람의 시트가 저마다 다른 창으로 읽히게.
  $("sheetBox").style.setProperty("--mt",s.color||"var(--gold)");
  openModal("sheetModal"); wireSwipe($("sheetBox"));
}
/* 내 단서(손패) — 어느 페이즈에서든 다시 확인. 조사한 카드는 사라지지 않는다. 큼지막하게 스와이프. */
function showMyHand(){
  if(!myRoleValid()){ banner("배역을 맡아야 단서가 있어요"); return; }
  const mineIds=new Set(myHand.map(c=>c.id));
  // 전체공개된 카드는 모두의 것이다 — 내 손패 뒤에 이어 붙여 한자리에서 다 보이게 한다.
  const pub=(STATE.revealed||[]).filter(c=>!mineIds.has(c.id));
  const cards=myHand.concat(pub);
  let h=`<div class="mhead">
      <div class="mh-t"><span class="mh-eb">내가 쥔 것</span><h2>🃏 내 단서</h2>
        <span class="mh-sub">손패 ${myHand.length}장 (비공개)${pub.length?` · 전체공개 ${pub.length}장`:""}</span></div>
      <button class="mh-x" onclick="closeModal('handModal')" aria-label="닫기">✕</button></div>
    <div class="mbody">
    <div class="mlead">내가 조사한 단서와, 테이블에 <b>전체공개된 카드</b>를 함께 봅니다. 손패는 알릴지 감출지 자유예요.</div>`;
  if(!cards.length){ h+=`<div class="panel-note">아직 조사한 단서가 없어요. 조사 페이즈에 카드를 열면 여기에 계속 쌓입니다.</div>`; }
  else{ const slides=cards.map(c=>{
      const isPub=!mineIds.has(c.id);
      return `<div class="bigcard clue${isPub?" pubclue":""}">
      <div class="bc-eyebrow">${isPub?"전체공개 · 모두가 봅니다":"손패 · 비공개"}</div>
      <div class="bc-title" style="color:${isPub?"var(--cold)":"var(--gold-b)"}">${esc(c.title)}</div>
      <div class="bc-tags"><span class="pill">${esc(c.locName)}</span>${c.spot?`<span class="pill">${esc(c.spot)}</span>`:''}<span class="pill">R${c.round}</span>${c.bait?'<span class="pill bad">※미끼일 수도</span>':''}</div>
      <div class="bc-body">${esc(c.text)}</div>${cnote(c)}
      ${c.unlocks&&!isPub?`<div class="unlocknote">🔓 이 카드를 <b>전체공개</b>하면 무언가 밝혀질 수 있습니다.</div>`:""}</div>`; });
    h+=buildSwipe(slides); }
  h+=`</div><div class="mfoot"><button class="btn" onclick="closeModal('handModal')">확인</button></div>`;
  $("handBox").innerHTML=h;
  $("handBox").style.setProperty("--mt","var(--gold)");
  openModal("handModal"); wireSwipe($("handBox"));
}

async function post(url,body){ try{ return await (await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json(); }catch(e){ banner("서버 연결 오류"); return {error:"network"}; } }
function openModal(id){ $(id).classList.add("on"); } function closeModal(id){ $(id).classList.remove("on"); }
$("input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); humanSay(); }});
$("input").addEventListener("input",e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(96,e.target.scrollHeight)+"px"; });
$("gmAiInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); gmSay(); }});
$("gmAiInput").addEventListener("input",e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(96,e.target.scrollHeight)+"px"; });
boot();
</script>
</body>
