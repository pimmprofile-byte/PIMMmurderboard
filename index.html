<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>졸업사진 卒業寫眞 — PIMMmurderboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E">

<style>
  /* 한글 웹폰트를 직접 얹는다. 예전에는 "Noto Sans KR" 같은 이름만 적어뒀는데
     그건 보는 사람 기기에 그 폰트가 깔려 있을 때만 먹는다 — 아이폰은 애플고딕,
     안드로이드는 로보토, 윈도우는 굴림으로 제각각 나왔다.
     KS X 1001 상용 2350자로 잘라 셋이 합쳐 700KB. swap이라 폰트가 늦어도 글은 바로 보인다. */
  @font-face{font-family:"PIMM Myeongjo";src:url("/assets/fonts/NanumMyeongjo-400.woff2") format("woff2");
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"PIMM Sans";src:url("/assets/fonts/NotoSansKR-400.woff2") format("woff2");
    font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:"PIMM Sans";src:url("/assets/fonts/NotoSansKR-700.woff2") format("woff2");
    font-weight:700;font-style:normal;font-display:swap}
  :root{
    --bg:#0b0a0d;--bg2:#111015;--panel:#17151d;--panel2:#1f1c27;--line:#2f2a3a;
    --ink:#ece7f0;--sub:#a49db8;--muted:#6f697f;
    --ember:#c8442f;--ember-b:#e7654c;--gold:#c9a24a;--gold-b:#e0bd6a;--cold:#7fb4d6;
    --good:#7ee0a8;--bad:#ff8f8f;--warn:#ffd479;--shadow:0 18px 50px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  html,body{overflow-x:hidden;max-width:100%}
  body{background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;
    font-family:"PIMM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo",sans-serif}
  .serif{font-family:"PIMM Myeongjo","Nanum Myeongjo","AppleMyungjo",serif}
  /* 줄갈이 — 한글은 단어 중간에서 끊기면 읽기가 확 나빠진다. 어절 단위로만 끊고,
     끊을 자리는 브라우저가 줄 길이를 고르게 맞춰 고르도록 한다. */
  body{word-break:keep-all;overflow-wrap:break-word;text-wrap:pretty}
  h1,h2,h3,h4{text-wrap:balance}
  button{font-family:inherit;color:inherit}
  .btn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;font-size:13.5px;transition:.15s}
  .btn:hover{border-color:var(--gold);color:#fff}
  .btn.gold{background:linear-gradient(90deg,#8a7038,var(--gold));border-color:var(--gold);color:#1a1509;font-weight:700}
  .btn.ember{background:linear-gradient(90deg,#7a1410,var(--ember));border-color:var(--ember-b);color:#fff;font-weight:700}
  .btn.gold:hover,.btn.ember:hover{filter:brightness(1.1)}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .pill{display:inline-block;font-size:11px;padding:2px 9px;border-radius:11px;background:var(--panel2);border:1px solid var(--line);color:var(--sub)}
  .pill.bad{color:var(--bad);border-color:#5a2c2c}
  .screen{display:none}.screen.on{display:block}

  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 44px}
  .head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .head .t{font-size:22px;font-weight:700;letter-spacing:.04em}
  .lead{color:var(--sub);font-size:13.5px;line-height:1.8;margin:2px 0 18px}
  /* ── 배역 선택: 2열 포스터 그리드 ──────────────────────────────
     세로 목록은 6명을 한눈에 못 비교하고 아바타도 작다. 카드를 포스터로 세워
     인물 사진(3:4)이 주인공이 되게 하고, 버튼은 카드에서 빼 아래 액션바로 모은다. */
  .role-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  @media(min-width:620px){ .role-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:12px} }
  /* 카드는 컨테이너, 실제 동작은 카드 안 '선택' 버튼이 맡는다 */
  .rc{position:relative;display:block;padding:0 0 10px;overflow:hidden;text-align:left;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;transition:border-color .16s,box-shadow .16s}
  .rc.off{opacity:.55}
  .rc.mine{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset,0 12px 34px -14px rgba(201,162,74,.5)}
  /* 인물 자리 — 사진이 있으면 사진, 없으면 이모지로 폴백(그 사이에도 안 깨진다) */
  .rc .por{position:relative;aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;
    background:linear-gradient(158deg,color-mix(in srgb,var(--rc,#555) 30%,#17141d),#0f0d13)}
  .rc .por .emo{font-size:64px;opacity:.92;filter:drop-shadow(0 8px 20px rgba(0,0,0,.65))}
  .rc .por img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
  .rc .scrim{position:absolute;left:0;right:0;bottom:0;padding:26px 10px 9px;
    background:linear-gradient(0deg,rgba(7,5,9,.95),rgba(7,5,9,.6) 52%,transparent)}
  .rc .nm{font-weight:800;font-size:15px;line-height:1.22;color:var(--rc,var(--ink));word-break:keep-all}
  .rc .jb{font-size:10.5px;color:#b3aabf;margin-top:2px}
  .rc .badge{position:absolute;top:7px;right:7px;z-index:2;font-size:9.5px;font-weight:700;letter-spacing:.04em;
    padding:3px 8px;border-radius:999px;background:rgba(6,4,8,.72);border:1px solid var(--line);color:var(--sub);backdrop-filter:blur(4px)}
  .rc .badge.me{color:var(--gold-b);border-color:#6b5730}
  .rc .badge.hu{color:var(--gold-b);border-color:#6b5730}
  .rc .badge.ai{color:#8fb3c9;border-color:#2c465a}
  /* -webkit-line-clamp는 브라우저에 따라 display가 blockify돼 안 먹는다.
     2줄 높이를 직접 잡고 넘치는 부분은 페이드로 흘려보낸다 — 글자가 중간에 잘려 보이지 않게. */
  .rc .tg{font-size:11.5px;line-height:1.5;color:#bdb5cb;padding:8px 10px 10px;
    height:calc(3em + 18px);overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 97%);
    mask-image:linear-gradient(180deg,#000 62%,transparent 97%)}
  /* 카드마다 붙는 선택 버튼 */
  .rc-go{display:block;width:calc(100% - 20px);margin:0 10px;padding:8px 6px;border-radius:9px;
    font-family:inherit;font-size:12.5px;font-weight:800;text-align:center;border:1px solid var(--line);
    background:var(--panel2);color:var(--sub);cursor:pointer;transition:.14s}
  .rc-go.pick{background:linear-gradient(180deg,#3a2f14,#2a2210);border-color:#6b5730;color:var(--gold-b)}
  .rc-go.pick:hover{background:linear-gradient(180deg,#4a3c1a,#332813);border-color:var(--gold)}
  .rc-go.mine{background:linear-gradient(180deg,#3a2f14,#2a2210);border-color:var(--gold);color:var(--gold-b)}
  .rc-go:not(.pick):not(.mine):hover{border-color:var(--gold);color:var(--ink)}
  .rc-go.off{background:none;border-color:transparent;color:var(--muted);font-weight:600;cursor:default}
  /* 전원 배역 확정 → 호스트 확정 박스 */
  .startbox{margin-top:16px;padding:15px 16px;border-radius:13px;text-align:center;
    border:1px solid #6b3a2c;background:linear-gradient(180deg,rgba(200,68,47,.16),rgba(200,68,47,.04))}
  .startbox .sb-t{font-weight:800;font-size:15px;color:#ffb9a8}
  .startbox .sb-d{font-size:12.5px;color:var(--sub);margin:5px 0 12px}
  .startbox.wait{border-color:var(--line);background:var(--panel2);color:var(--sub);font-size:13px}
  /* 카드에서 뺀 액션들 — 내 배역 여부에 따라 바뀌는 하단 바 */
  .rolebar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .rolebar .hint{font-size:12px;color:var(--muted)}

  /* 플레이 · 페이즈 드리븐 */
  #s-play{display:none;flex-direction:column;height:100vh;max-width:920px;width:100%;margin:0 auto;border-inline:1px solid var(--line)}#s-play.on{display:flex}
  .chead{display:flex;align-items:center;gap:8px;padding:9px 13px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(17,15,21,.97),rgba(17,15,21,.85));flex-wrap:wrap}
  .chead .rt{font-weight:700;display:flex;align-items:center;gap:6px;font-size:14px}.chead .rt .mk{color:var(--ember)}
  .chead .ph{font-size:12px;color:var(--gold)}.chead .me{font-size:12px;color:var(--sub)}.chead .spacer{margin-left:auto}
  .pbanner{padding:9px 14px;border-bottom:1px solid var(--line);background:var(--bg2);font-size:13px;color:#dfe4f4;line-height:1.6}
  .pbanner .g{color:var(--gold);font-size:11px;letter-spacing:.06em;margin-right:6px}
  .pbanner .il{color:var(--cold);margin-top:5px;font-size:12.5px}
  .ppanel{flex:1 1 auto;overflow-y:auto;padding:14px}
  #s-play.talk .ppanel,#s-play.reveal .ppanel{flex:0 1 auto;max-height:30vh}
  .chat{flex:0 0 32vh;overflow-y:auto;padding:12px 14px;border-top:1px solid var(--line);background:radial-gradient(130% 90% at 50% 0%,#14101a,var(--bg) 70%);display:flex;flex-direction:column;gap:10px}
  #s-play.talk .chat{flex:1 1 auto}
  .sys{align-self:center;text-align:center;color:var(--muted);font-size:12px;border:1px dashed var(--line);border-radius:20px;padding:4px 14px;max-width:92%}
  .sys.bc{color:var(--cold);border-color:#2c465a;background:#0e1620}
  .msg{display:flex;gap:8px;max-width:90%}.msg.own{align-self:flex-end;flex-direction:row-reverse}
  .msg .av{font-size:18px;width:32px;height:32px;flex:0 0 32px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .msg .nm{font-size:11px;font-weight:700;margin:0 0 2px 2px}.msg.own .nm{text-align:right}
  .msg .bub{background:var(--panel);border:1px solid var(--line);border-radius:4px 12px 12px 12px;padding:8px 12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.own .bub{background:linear-gradient(135deg,#8a7038,var(--gold));color:#1a1509;border-radius:12px 4px 12px 12px}
  .tag-me{font-size:9px;color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:0 4px;margin-left:4px}
  /* 심층심문(취조) — 채팅 로그 안의 결과 카드 */
  .interrog{align-self:center;max-width:94%;border-radius:12px;padding:9px 13px;margin:2px 0;font-size:13px;border:1px solid var(--line);background:var(--panel)}
  .interrog .ig-head{font-weight:700;font-size:11.5px;color:var(--muted);margin-bottom:4px}
  .interrog .ig-line{line-height:1.6;white-space:pre-wrap;font-size:13.5px}
  .interrog.truth{border-color:#7a2c2c;background:#2a1214}.interrog.truth .ig-head{color:#ff8a8a}
  .interrog.evasive{border-color:#3a3a3a;background:#181818}.interrog.evasive .ig-head{color:var(--muted)}
  .interrog.plain{border-color:#2c465a;background:#0e1620}.interrog.plain .ig-head{color:var(--cold)}
  /* 심층심문 패널 — 토론 페이즈 */
  .ig-list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .ig-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 11px;border:1px solid var(--line);border-radius:11px;background:var(--panel2)}
  .ig-who{display:flex;align-items:center;gap:6px;font-weight:700;font-size:13px;min-width:96px}
  .ig-cards{display:flex;gap:6px;flex-wrap:wrap}
  .ig-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:5px 12px;font-size:12px;cursor:pointer;color:inherit;font-family:inherit}
  .ig-card:hover{border-color:var(--gold)}
  .ig-card:disabled{opacity:.4;cursor:not-allowed}
  .ig-evlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .ig-ev{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:12px;cursor:pointer;color:inherit;font-family:inherit;text-align:left}
  .ig-ev.on{border-color:var(--ember);color:var(--ember-b)}
  .composer{display:flex;gap:8px;padding:9px 12px;border-top:1px solid var(--line);background:var(--bg2);align-items:flex-end}
  .composer .melab{font-size:12px;color:var(--sub);align-self:center;white-space:nowrap;max-width:88px;overflow:hidden;text-overflow:ellipsis}
  .composer textarea{flex:1;resize:none;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:9px 12px;font-size:14px;font-family:inherit;line-height:1.5;max-height:96px}
  .composer textarea:focus{outline:none;border-color:var(--gold)}.composer textarea:disabled{opacity:.5}
  .banner{background:#2a1414;border:1px solid #5a2c2c;color:#ffd3d3;padding:8px 14px;font-size:13px;text-align:center;display:none}.banner.on{display:block}
  .aicall{display:flex;gap:6px;flex-wrap:wrap;padding:7px 12px;border-top:1px solid var(--line);background:var(--bg2);align-items:center}
  .aicall .lb{font-size:11px;color:var(--muted)}
  .aichip{display:inline-flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:4px 10px;cursor:pointer;font-size:12px}
  .aichip:hover{border-color:var(--sc)}.aichip .d{width:8px;height:8px;border-radius:50%;background:var(--sc)}

  /* 오프닝/토론 패널 */
  .intro{white-space:pre-line;font-size:15px;line-height:1.95;color:#ded8ea;border-left:2px solid var(--ember);padding-left:14px}
  .panel-note{color:var(--sub);font-size:13.5px;line-height:1.8}

  /* 카드맵 */
  .clue-h{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .clue-h h3{margin:0;font-size:15px;color:var(--gold-b)}
  .loc-group{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
  .loc-group .lh{padding:8px 12px;background:var(--panel2);font-weight:700;font-size:13px}
  .cardmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,104px),1fr));gap:8px;padding:9px}
  /* 학교 구획도(플로어 플랜) */
  .floormap{display:grid;gap:11px;grid-template-columns:repeat(3,1fr);
    grid-template-areas:"roof roof roof" "art bcast staff" "class class class"}
  /* 데이터 구동 존 그리드(시나리오 map 기반) */
  .floormap.generic{grid-template-columns:repeat(auto-fill,minmax(min(100%,215px),1fr));grid-template-areas:none}
  .room{border:1px solid var(--line);border-radius:13px;padding:10px 11px;background:linear-gradient(160deg,#161320,#111017);position:relative;animation:roomIn .5s ease both}
  @keyframes roomIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .room .rmh{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#d7d0e4;margin-bottom:9px;border-bottom:1px dashed var(--line);padding-bottom:6px}
  .room .rmh .fl{margin-left:auto;font-size:9.5px;color:var(--muted);font-weight:400;letter-spacing:.03em}
  .room .cardmap{padding:0;grid-template-columns:repeat(auto-fill,minmax(min(100%,80px),1fr));gap:7px}
  .room.roof{grid-area:roof;background:linear-gradient(160deg,#131a21,#0e1218)}
  .room.art{grid-area:art}.room.bcast{grid-area:bcast}.room.staff{grid-area:staff}
  .room.class{grid-area:class;border-color:#553236;background:linear-gradient(160deg,#1d1417,#140f13)}
  .room.class .scene{border:1px solid #6e3a3a;border-radius:10px;padding:8px;background:rgba(120,42,42,.14);margin-bottom:8px}
  .room.class .scene .sh{font-size:11px;font-weight:700;color:#f0a99e;margin-bottom:6px;letter-spacing:.02em}
  .room .cardmap .gcard{aspect-ratio:auto;min-height:100px}
  @media(max-width:640px){ .floormap{grid-template-columns:1fr;grid-template-areas:"roof" "art" "bcast" "staff" "class"} }
  .gcard{aspect-ratio:3/4;border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;cursor:pointer;position:relative;overflow:hidden;background:linear-gradient(160deg,#1a1722,#141119);transition:.15s}
  .gcard:hover{transform:translateY(-2px);border-color:var(--gold)}
  .gcard .rb{font-size:9.5px;color:var(--muted)}
  .gcard .t{font-size:12px;font-weight:700;margin-top:auto;line-height:1.3}
  .gcard.face{align-items:center;justify-content:center;background:repeating-linear-gradient(135deg,#181521,#181521 6px,#15121d 6px,#15121d 12px)}
  .gcard.face .q{font-size:26px;font-family:"PIMM Myeongjo","Nanum Myeongjo",serif;color:#3c354c}
  /* 뒤집힌 카드는 '어디를 뒤지는지'로 고른다 — 라벨 번호 대신 자리 이름 */
  .gcard.face{padding:20px 6px 22px}
  .gcard.face .sp{font-size:11.5px;font-weight:700;line-height:1.35;color:#9b93ad;text-align:center;
    word-break:keep-all;text-wrap:balance}
  .gcard.face:hover .sp{color:var(--gold-b)}
  .gcard.locked .sp{color:#5d5670}
  .gcard.face.taken .q{font-size:16px;margin-bottom:3px}
  .gcard.face.taken .sp{font-size:10.5px;font-weight:600}
  .gcard .spot{font-size:10px;color:var(--muted);margin-top:3px;line-height:1.3;word-break:keep-all}
  .gcard.face .rb{position:absolute;bottom:7px;left:0;right:0;text-align:center}.gcard.face .tag{color:var(--gold-b)}
  .gcard.locked{cursor:default;opacity:.5}
  /* 손패 상한 정리 */
  .trimgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;margin-top:4px}
  .trimcard{text-align:left;background:linear-gradient(160deg,#221c14,#171219);border:1px solid #5a4a2c;border-radius:12px;padding:12px;color:inherit;transition:.15s}
  .trimcard:hover{border-color:var(--gold)}
  .trimcard.on{border-color:var(--ember);box-shadow:0 0 0 1px var(--ember) inset,0 0 18px -6px var(--ember)}
  .trimcard .tt{font-weight:800;color:var(--gold-b);font-size:14.5px;margin-bottom:6px}
  .trimcard .tm{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
  .trimcard .tb{font-size:12.5px;color:#ded8ea;line-height:1.6}
  .trimact{display:flex;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap}
  .trimact .btn{margin-left:auto}
  .keeprow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .keeprow:last-child{border-bottom:0}
  .keeprow .nm{font-weight:800}
  .keeprow .lb{color:var(--sub);flex:1;min-width:160px}
  .keeprow .rs{font-family:"SF Mono",Consolas,monospace;font-size:11.5px;padding:2px 9px;border-radius:999px;border:1px solid var(--line)}
  .keeprow.ok .rs{color:var(--good);border-color:#2f6b48}
  .keeprow.no .rs{color:var(--bad);border-color:#6b2f2f}
  .keeprow .dt{flex-basis:100%;font-size:12px;color:var(--muted)}
  .handwarn{background:#3a1f10;border:1px solid #7a4520;color:#ffd9b0;border-radius:11px;padding:10px 13px;margin-bottom:11px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .handwarn b{color:#ffc078}
  .handwarn .btn{margin-left:auto}
  .gcard.face.taken{border-color:var(--tc,#555);background:linear-gradient(160deg,#16131c,#100e14);opacity:.75;cursor:not-allowed}
  .gcard.face.taken .q{font-size:20px;filter:grayscale(.2)}
  .gcard.face.taken .rb{color:var(--tc,var(--muted));font-size:9.5px}
  .gcard.hand{border-color:#5a4a2c;background:linear-gradient(160deg,#221c14,#171219)}.gcard.hand .t{color:var(--gold-b)}
  .gcard.pub{border-color:var(--cold);background:linear-gradient(160deg,#111a22,#0e1620)}.gcard.pub.baitc{border-color:#5a4a2c}
  .gcard .tag{position:absolute;top:6px;right:6px;font-size:8.5px;padding:1px 5px;border-radius:6px;background:rgba(0,0,0,.45)}
  .gcard.hand .tag{color:var(--gold-b)}.gcard.pub .tag{color:var(--cold)}

  /* 질문지 */
  .q-block{margin-bottom:13px}.q-block .q{font-size:14px;color:var(--gold-b);margin-bottom:6px;font-weight:600}
  .q-block textarea{width:100%;min-height:62px;resize:vertical;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:9px 11px;font-size:13.5px;font-family:inherit;line-height:1.55}
  .q-block textarea:focus{outline:none;border-color:var(--gold)}
  .grade{display:flex;gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}.grade .v{flex-basis:100%;font-size:12px;color:var(--muted)}
  .verdict{font-size:23px;font-weight:800;margin-bottom:10px}.verdict.good{color:var(--good)}.verdict.warn{color:var(--warn)}.verdict.bad{color:var(--bad)}
  .rev-sol{font-size:14px;line-height:1.85;color:#e4dff0;white-space:pre-wrap}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 17px;margin-bottom:14px}
  .card h2{margin:0 0 10px;font-size:15px;color:var(--gold-b)}
  .modal{position:fixed;inset:0;background:rgba(6,4,8,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}.modal.on{display:flex}
  .modal .box{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:540px;width:100%;padding:22px;box-shadow:var(--shadow);max-height:92vh;overflow-y:auto}
  .modal h2{margin:0 0 4px;font-size:20px}.modal .mlead{color:var(--sub);font-size:13px;margin-bottom:14px}
  .sec{border-top:1px dashed var(--line);padding-top:11px;margin-top:11px}.sec:first-of-type{border-top:0;margin-top:0;padding-top:0}
  .sec .h{font-weight:700;color:var(--gold-b);font-size:13.5px;margin-bottom:4px}.sec .b{font-size:14px;color:#ded8ea;line-height:1.72}
  .hb{background:#2a1214;border:1px solid #5a2c2c;color:#ffb9b9;border-radius:10px;padding:11px 14px;font-weight:700;text-align:center;margin-bottom:12px}
  .frag{background:#0e1620;border:1px solid #2c465a;border-radius:10px;padding:9px 12px;margin:8px 0;color:#cfe0ee;font-size:13.5px}.frag .w{font-size:11px;color:var(--cold);margin-bottom:3px}
  .goal{display:flex;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line)}.goal:last-child{border-bottom:0}.goal .pt{margin-left:auto;color:var(--good);font-weight:700;font-family:"PIMM Myeongjo","Nanum Myeongjo",serif}
  /* ── 스와이프 카드 캐러셀 (롤카드·손패 넘겨보기) ── */
  .swipe{position:relative;margin:6px 0 2px}
  .sw-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .sw-track::-webkit-scrollbar{display:none}
  .sw-slide{flex:0 0 100%;scroll-snap-align:center;min-width:0;padding:2px}
  /* 좌우 화살표는 카드 위에 겹치지 않게 카드 아래 컨트롤 줄에 둔다(점 네비와 한 줄) */
  .sw-ctrl{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:13px}
  .sw-nav{position:static;flex:0 0 auto;width:32px;height:32px;border-radius:50%;
    background:var(--panel2);border:1px solid var(--line);color:var(--ink);font-size:19px;line-height:1;display:grid;place-items:center;cursor:pointer;transition:.15s}
  .sw-nav:hover:not(:disabled){border-color:var(--gold);color:#fff}
  .sw-nav:disabled{opacity:.2;cursor:default}
  .sw-dots{display:flex;gap:6px;justify-content:center;align-items:center;flex-wrap:wrap}
  .sw-dot{width:7px;height:7px;border-radius:50%;background:var(--line);transition:.22s;cursor:pointer}
  .sw-dot.on{background:var(--gold);width:22px;border-radius:4px}
  .sw-count{text-align:center;font-size:11.5px;color:var(--muted);margin-top:5px;letter-spacing:.02em}
  /* 큰 카드(롤/손패) */
  .bigcard{border-radius:16px;padding:18px 18px 20px;background:linear-gradient(165deg,#1d1a25,#141119);border:1px solid var(--line);min-height:220px}
  .bigcard.role{border-color:color-mix(in srgb,var(--rc,#8a7a4a) 45%,var(--line));background:linear-gradient(165deg,#211c28,#15121b)}
  .bigcard.role::before{content:"";display:block;height:3px;width:46px;border-radius:3px;background:var(--rc,var(--gold));margin-bottom:14px}
  .bigcard.clue{border-color:#5a4a2c;background:linear-gradient(165deg,#241d13,#17121a)}
  .bc-eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);margin-bottom:9px}
  .bc-title{font-weight:800;font-size:20px;line-height:1.28;color:#f2ecdf}
  .bc-title.role{color:var(--rc,#f2ecdf)}
  .bc-sub{font-size:13px;color:var(--sub);margin-top:4px}
  .bc-body{font-size:15.5px;line-height:1.8;color:#e2dcef;margin-top:14px;white-space:pre-wrap}
  /* 해석 노트 — 카드가 무슨 뜻인지 한 줄로 짚어준다(결론은 말하지 않는다) */
  .cnote{margin-top:12px;padding:9px 11px;border-left:2px solid #5a4a2c;background:rgba(200,160,80,.07);
    border-radius:0 8px 8px 0;color:#cbbf9f;font-size:13px;line-height:1.7}
  .cnote b{color:var(--gold-b);font-weight:700;font-size:11.5px;letter-spacing:.06em;display:block;margin-bottom:2px}
  .bc-avwrap{display:flex;align-items:center;gap:14px;margin-bottom:6px}
  .bc-av{font-size:34px;width:60px;height:60px;display:grid;place-items:center;background:var(--bg);border-radius:15px;flex:0 0 60px;border:1px solid var(--line)}
  .bc-tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
  .bc-hidden{margin-top:14px;background:#2a1412;border:1px solid #6a2a26;border-radius:10px;padding:10px 13px;color:#f0b8b0;font-size:13.5px;font-weight:600}
  .bc-goal{display:flex;gap:10px;font-size:15px;padding:9px 0;border-bottom:1px solid var(--line)}.bc-goal:last-child{border-bottom:0}.bc-goal .pt{margin-left:auto;color:var(--good);font-weight:700;font-family:"PIMM Myeongjo","Nanum Myeongjo",serif}
  /* 내 정보(배역 시트)는 한 번에 읽을 분량이 많다 — 팝업을 넓히고 본문을 키운다.
     본문 줄길이는 measure로 잡아, 넓어져도 한 줄이 지나치게 길어지지 않게 한다. */
  #sheetModal .box{max-width:760px;padding:26px 26px 22px}
  #sheetModal h2{font-size:22px}
  #sheetModal .mlead{font-size:13.5px;margin-bottom:16px}
  #sheetModal .bigcard{min-height:300px;padding:24px 26px 26px}
  #sheetModal .bc-eyebrow{font-size:11.5px;margin-bottom:11px}
  #sheetModal .bc-title{font-size:24px;line-height:1.3}
  #sheetModal .bc-sub{font-size:14.5px;margin-top:5px}
  #sheetModal .bc-body{font-size:17px;line-height:1.92;margin-top:17px;max-width:60ch}
  #sheetModal .bc-av{font-size:38px;width:66px;height:66px;flex:0 0 66px;border-radius:16px}
  #sheetModal .bc-hidden{font-size:14.5px;padding:12px 15px;margin-top:16px}
  #sheetModal .bc-goal{font-size:16.5px;padding:12px 0;line-height:1.6}
  #sheetModal .frag{font-size:14.5px;line-height:1.75;padding:11px 14px}
  #sheetModal .sw-count{font-size:12.5px}
  /* ── 조사 턴 (차례 표시·키컬러) ── */
  .turnbar{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:12px 13px;margin-bottom:12px}
  .turnbar .tb-h{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:10px}
  .turnbar .tb-now{font-weight:800;font-size:14.5px}
  .turnbar .tb-tag{font-family:"SF Mono",Consolas,monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 7px;margin-left:auto}
  .turnbar .tb-tag.mine{color:var(--gold-b);border-color:var(--gold)}
  .tb-order{display:flex;gap:6px;flex-wrap:wrap}
  .tb-chip{display:flex;align-items:center;gap:5px;font-size:12px;padding:4px 10px 4px 8px;border-radius:999px;
    border:1px solid var(--line);background:var(--bg);color:var(--sub);opacity:.55;transition:.2s}
  .tb-chip .d{width:8px;height:8px;border-radius:50%;background:var(--tc,#888);flex:0 0 auto}
  .tb-chip.on{opacity:1;border-color:var(--tc,var(--gold));color:#fff;box-shadow:0 0 12px -3px var(--tc,var(--gold))}
  .tb-chip.done{opacity:.4;text-decoration:line-through}
  .turnbar .tb-act{margin-top:11px;display:flex;gap:8px;flex-wrap:wrap}
  .turnbar .tb-act .btn{flex:1;min-width:120px;text-align:center}
  .tb-wait{margin-top:10px;font-size:12.5px;color:var(--muted);text-align:center}

  /* ============ GM 마킹 보드 ============ */
  #s-gm{display:none;flex-direction:column;height:100vh}#s-gm.on{display:flex}
  .gm-main{flex:1 1 auto;display:flex;min-height:0}
  .gm-matrix{flex:1.3 1 0;overflow-y:auto;padding:14px 16px 30px;min-width:0}
  .gm-wrap{padding:0}
  .gm-side{flex:1 1 0;max-width:440px;display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--bg2)}
  .gm-side-h{padding:10px 14px;font-weight:700;font-size:13px;color:var(--gold-b);border-bottom:1px solid var(--line);flex:0 0 auto}
  .gm-side #gmChat{flex:1 1 auto;overflow-y:auto;min-height:0}
  .gm-side .composer{flex:0 0 auto;border-top:1px solid var(--line)}
  #gmAiRole{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:9px;padding:8px;font-size:12.5px;font-family:inherit;align-self:center;max-width:120px}
  @media(max-width:820px){ .gm-main{flex-direction:column;overflow-y:auto} .gm-matrix{flex:none;overflow:visible} .gm-side{flex:none;max-width:none;border-left:0;border-top:1px solid var(--line);height:60vh} }
  .gm-guide{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 15px;margin-bottom:14px}
  .gm-guide .g{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--gold-b);border:1px solid var(--gold);border-radius:6px;padding:1px 7px;margin-right:8px}
  .gm-guide .il{margin-top:8px;color:#e8dfb0;font-style:italic;font-size:13px}
  .gm-note{color:var(--muted);font-size:12px;margin:2px 0 14px}
  .gm-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--sub);margin-bottom:10px}
  .gm-legend b{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;margin-right:4px}
  .gm-row{display:flex;align-items:flex-start;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
  .gm-row .who{min-width:118px;flex-shrink:0}
  .gm-row .who .nm{font-weight:700;font-size:14px}
  .gm-row .who .cnt{font-size:11.5px;color:var(--muted);margin-top:2px}
  .gm-row .who .cnt.full{color:var(--ember-b);font-weight:700}
  .gm-row .who .kind{font-size:10.5px;color:var(--gold-b)}
  .gm-cells{display:flex;flex-wrap:wrap;gap:6px;flex:1}
  .gm-loc{display:flex;flex-direction:column;gap:4px;padding:6px;border:1px dashed var(--line);border-radius:9px;background:#120f18}
  .gm-loc .lh{font-size:9.5px;color:var(--muted);letter-spacing:.04em}
  .gm-loc .cs{display:flex;gap:5px;flex-wrap:wrap}
  .cell{width:44px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--sub);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.12s;position:relative}
  .cell:hover:not(.locked){border-color:var(--gold);color:#fff}
  .cell.on{background:linear-gradient(150deg,#211b28,#2b2333);border-color:var(--cc,var(--gold));color:#fff;box-shadow:0 0 13px -3px var(--cc,var(--gold))}
  .cell.on::after{content:"✓";position:absolute;top:-5px;right:-4px;font-size:10px;background:var(--cc,var(--gold));color:#120f16;border-radius:50%;width:14px;height:14px;line-height:14px;text-align:center;font-weight:800}
  @keyframes markPop{0%{transform:scale(1)}28%{transform:scale(1.28);box-shadow:0 0 20px 3px var(--cc,var(--gold))}60%{transform:scale(.96)}100%{transform:scale(1)}}
  .cell.justmark{animation:markPop .75s cubic-bezier(.2,.8,.2,1)}
  .cell.dim{opacity:.4}
  /* GM 시네마틱 낭독 패널 */
  .gm-cine{max-width:760px;margin:0 auto;padding:34px 22px 30px;text-align:center}
  .gm-cine .ck{font-size:12px;letter-spacing:.42em;color:var(--ember-b);margin-bottom:30px;text-transform:uppercase}
  .gm-cine .ln{font-size:clamp(16px,2.4vw,22px);line-height:2.05;color:#e9e1f2;opacity:0;animation:cineLine 1s ease forwards;text-shadow:0 6px 30px rgba(0,0,0,.7)}
  .gm-cine .vic{margin-top:26px;font-size:clamp(15px,2.2vw,19px);color:var(--ember-b);font-style:italic;opacity:0;animation:cineLine 1s ease forwards}
  .gm-cine .go{margin-top:34px;color:var(--sub);font-size:13.5px;opacity:0;animation:cineLine 1s ease forwards;border-top:1px solid var(--line);padding-top:20px}
  @keyframes cineLine{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}
  /* 오프닝 사건개요 — 문단별 시네마틱 등장 */
  .cine-intro .cine-p{opacity:0;margin:0 0 15px;line-height:1.95;font-size:14.5px;color:#d3ccde;animation:cineLine 1s ease forwards}
  .cine-intro .cine-p:last-child{margin-bottom:0}
  @media (prefers-reduced-motion: reduce){ .cine-intro .cine-p{animation-duration:.01ms!important} }
  @media (prefers-reduced-motion: reduce){ .gm-cine .ln,.gm-cine .vic,.gm-cine .go{animation-duration:.01ms!important} }
  .cell .rq{position:absolute;bottom:-3px;left:0;right:0;text-align:center;font-size:7.5px;color:var(--muted)}
  @media(max-width:560px){ .gm-row .who{min-width:88px} .cell{width:40px;height:32px} }

  /* ============ 연출 애니메이션 ============ */
  /* 조사카드 뒤집힘(맵) */
  @keyframes cardFlip{0%{transform:rotateY(90deg) scale(.9);opacity:0}55%{opacity:1}100%{transform:rotateY(0) scale(1);opacity:1}}
  .gcard.just-open{animation:cardFlip .5s cubic-bezier(.2,.7,.2,1) both}
  /* 조사카드 모달 공개 */
  @keyframes boxReveal{0%{transform:perspective(1200px) rotateX(14deg) translateY(24px) scale(.94);opacity:0;filter:blur(6px)}100%{transform:none;opacity:1;filter:none}}
  .modal .box.reveal{animation:boxReveal .5s cubic-bezier(.16,.8,.24,1) both}
  @keyframes glowPulse{0%{box-shadow:var(--shadow),0 0 0 0 rgba(201,162,74,.0)}30%{box-shadow:var(--shadow),0 0 34px 4px rgba(201,162,74,.45)}100%{box-shadow:var(--shadow),0 0 0 0 rgba(201,162,74,0)}}
  .modal .box.reveal.clue{animation:boxReveal .5s cubic-bezier(.16,.8,.24,1) both,glowPulse 1.5s ease .3s 1}
  /* 충격 단서(A5류) — 붉은 섬광 + 흔들림 */
  @keyframes shockFlash{0%{transform:none}8%{transform:translateX(-5px)}16%{transform:translateX(5px)}24%{transform:translateX(-4px)}32%{transform:translateX(3px)}40%{transform:none}}
  @keyframes shockTint{0%{box-shadow:var(--shadow),inset 0 0 0 0 rgba(200,68,47,0)}20%{box-shadow:var(--shadow),inset 0 0 60px 6px rgba(200,68,47,.5)}100%{box-shadow:var(--shadow),inset 0 0 0 0 rgba(200,68,47,0)}}
  .modal .box.reveal.shock{animation:boxReveal .4s ease both,shockFlash .5s ease .35s 1,shockTint 1.6s ease .35s 1}
  /* 미끼 단서 — 금빛 어른거림 */
  @keyframes baitShimmer{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:var(--shadow),0 0 26px 2px rgba(201,162,74,.32)}}
  .modal .box.reveal.bait{animation:boxReveal .5s ease both,baitShimmer 2.2s ease .3s 2}

  /* 기억의 파편 떠오름 */
  @keyframes fragSurface{0%{opacity:0;filter:blur(8px);transform:translateY(10px)}100%{opacity:1;filter:blur(0);transform:none}}
  .frag{animation:fragSurface .7s ease both}
  .frag.newfrag{border-color:#4d7ea6;box-shadow:0 0 22px -4px rgba(127,180,214,.55)}
  @keyframes fragPing{0%,100%{box-shadow:0 0 0 0 rgba(127,180,214,0)}40%{box-shadow:0 0 26px 2px rgba(127,180,214,.6)}}
  .frag.newfrag{animation:fragSurface .7s ease both,fragPing 1.8s ease .5s 2}

  /* ── 오프닝 비주얼노벨 ──────────────────────────────────────────
     GM 화면에 띄우는 연출이라 무대는 16:9로 고정하고 레터박스로 가운데 둔다.
     무대 안의 치수는 전부 cqw(무대 폭 기준)라, 화면이 크든 작든 비율이 같다.
     배경·인물 이미지가 하나도 없어도 그라데이션 폴백으로 그대로 성립한다. */
  #vn{position:fixed;inset:0;z-index:90;display:none;background:#000;
    place-items:center;overflow:hidden}
  #vn.on{display:grid}
  #vn .vn-stage{position:relative;overflow:hidden;background:#050407;
    width:min(100vw,calc(100vh * 16 / 9));height:min(100vh,calc(100vw * 9 / 16));
    container-type:inline-size}
  #vn .vn-bg{position:absolute;inset:0;background-size:cover;background-position:center;
    transition:opacity .55s ease, transform 7s linear;opacity:0;transform:scale(1.07)}
  #vn .vn-bg.show{opacity:1;transform:scale(1)}
  /* 이미지가 없을 때의 폴백 — 컷 분위기를 색으로만 낸다 */
  #vn .vn-bg.calm{background-image:radial-gradient(120% 90% at 50% 35%,#1b2733,#0a0f16 60%,#05070a)}
  #vn .vn-bg.bg{background-image:radial-gradient(120% 90% at 50% 40%,#2a0f10,#12060a 60%,#05070a)}
  #vn .vn-bg.body{background-image:radial-gradient(110% 80% at 50% 60%,#24080b,#0d0508 60%,#040305)}
  #vn .vn-bg.scene{background-image:radial-gradient(120% 90% at 45% 40%,#231017,#0f0810 62%,#05070a)}
  #vn .vn-vig{position:absolute;inset:0;pointer-events:none;
    box-shadow:inset 0 0 14cqw 5cqw rgba(0,0,0,.85);
    background:linear-gradient(0deg,rgba(4,3,6,.95) 0%,rgba(4,3,6,.6) 26%,transparent 52%)}

  /* 인물 컷 — 인물 이미지는 배경이 딸린 완성 일러스트라 누끼 스프라이트처럼 쓸 수 없다.
     그래서 극화 만화의 인물 컷처럼 테두리를 준 패널로 세우고, 아랫단은 텍스트박스 뒤로 물린다.
     말하는 동안은 뒷배경을 눌러 인물이 앞으로 나오게 한다. */
  #vn .vn-sprite{position:absolute;right:5cqw;bottom:20cqw;height:52%;width:auto;
    object-fit:cover;border-radius:.5cqw;
    border:.12cqw solid color-mix(in srgb,var(--spk,#c9c2b4) 55%,transparent);
    box-shadow:0 1cqw 4.5cqw rgba(0,0,0,.75), 0 0 0 .5cqw rgba(4,3,6,.55);
    opacity:0;transform:translate(1.6cqw,1.2cqw) scale(.985);
    transition:opacity .42s ease, transform .42s cubic-bezier(.2,.7,.3,1)}
  #vn .vn-sprite.show{opacity:1;transform:none}
  /* 이미지가 없는 배역은 이모지로 대신한다 */
  #vn .vn-emo{position:absolute;right:11cqw;bottom:24cqw;font-size:14cqw;line-height:1;
    opacity:0;transform:translateY(1.2cqw);transition:opacity .42s ease,transform .42s ease;
    filter:drop-shadow(0 0 2cqw rgba(0,0,0,.9)) saturate(.7)}
  #vn .vn-emo.show{opacity:.9;transform:none}
  #vn .vn-bg{filter:none;transition:opacity .55s ease,transform 7s linear,filter .5s ease}
  #vn.speak .vn-bg{filter:brightness(.5) saturate(.75)}

  /* 텍스트박스 */
  #vn .vn-box{position:absolute;left:0;right:0;bottom:0;padding:0 6cqw 5cqw;
    display:flex;flex-direction:column;align-items:flex-start}
  #vn .vn-name{display:none;align-self:flex-start;margin:0 0 -.35cqw 1.2cqw;
    padding:.75cqw 2.2cqw;border-radius:.6cqw .6cqw 0 0;
    font-size:1.85cqw;letter-spacing:.06em;font-weight:700;color:#0a0810;
    background:var(--spk,#c9c2b4);box-shadow:0 -.2cqw 1.2cqw rgba(0,0,0,.5)}
  #vn.speak .vn-name{display:block}
  #vn .vn-panel{width:100%;min-height:15cqw;padding:2.6cqw 3cqw;
    background:linear-gradient(180deg,rgba(9,8,13,.82),rgba(6,5,9,.93));
    border:1px solid rgba(255,255,255,.13);border-radius:.9cqw;
    backdrop-filter:blur(6px);box-shadow:0 .6cqw 4cqw rgba(0,0,0,.6)}
  #vn.speak .vn-panel{border-left:.35cqw solid var(--spk,#c9c2b4)}
  #vn .vn-line{font-family:"PIMM Myeongjo","Nanum Myeongjo","AppleMyungjo",serif;color:#f2ecdf;
    font-size:2.5cqw;line-height:1.78;letter-spacing:-.005em;
    text-shadow:0 .2cqw 1.2cqw rgba(0,0,0,.95);
    word-break:keep-all;text-wrap:balance;min-height:1.78em}
  #vn .vn-line+.vn-line{margin-top:.7cqw}
  #vn.speak .vn-line{color:#fff}
  /* 타자 연출은 글자를 "덧붙이지" 않고, 처음부터 전체를 깔아둔 뒤 안 읽은 쪽을 감춘다.
     그래야 글자가 늘어날 때마다 줄갈이가 다시 계산돼 문장이 들썩이는 일이 없다. */
  #vn .vn-off{opacity:0}
  #vn .vn-line.typing .vn-on::after{content:"";display:inline-block;width:.1em;height:1em;
    margin:0 -.1em 0 .04em;vertical-align:-.13em;background:var(--spk,#c9c2b4);
    animation:vnCaret .8s steps(1) infinite}
  @keyframes vnCaret{50%{opacity:0}}

  #vn .vn-bar{display:flex;align-items:center;gap:1.4cqw;margin-top:1.8cqw;width:100%}
  #vn .vn-dots{display:flex;gap:.55cqw;flex:1;flex-wrap:wrap}
  #vn .vn-dot{width:.62cqw;height:.62cqw;border-radius:50%;background:rgba(255,255,255,.22)}
  #vn .vn-dot.on{background:var(--ember-b);width:2cqw;border-radius:.31cqw}
  #vn .vn-hint{font-size:1.4cqw;color:rgba(255,255,255,.5);letter-spacing:.04em;white-space:nowrap}
  #vn .vn-tools{position:absolute;top:2.2cqw;right:2.2cqw;z-index:4;display:flex;gap:1cqw}
  #vn .vn-tool{background:rgba(6,4,8,.62);border:1px solid rgba(255,255,255,.18);
    color:rgba(255,255,255,.72);border-radius:999px;padding:.8cqw 1.9cqw;
    font-size:1.5cqw;font-family:inherit;cursor:pointer;backdrop-filter:blur(5px);line-height:1.3}
  #vn .vn-tool:hover{color:#fff;border-color:var(--ember-b)}

  /* 극 진행 연출 — 컷의 fx 값이 무대에 클래스로 붙는다 */
  #vn .vn-flash{position:absolute;inset:0;pointer-events:none;opacity:0}
  #vn .vn-stage.fx-alarm .vn-flash{background:radial-gradient(120% 90% at 50% 40%,rgba(224,60,42,.55),transparent 70%);
    animation:vnAlarm 1.15s ease-out 3}
  #vn .vn-stage.fx-thud  .vn-flash{background:#000;animation:vnBlack .5s ease-out 1}
  #vn .vn-stage.fx-static .vn-flash{background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 1px,transparent 1px 3px);
    animation:vnStatic .5s steps(3) 3}
  #vn .vn-stage.fx-water .vn-flash{background:linear-gradient(0deg,rgba(46,90,172,.5),transparent 55%);
    animation:vnRise 1.9s ease-out 1}
  @keyframes vnAlarm{0%,100%{opacity:0}45%{opacity:1}}
  @keyframes vnBlack{0%{opacity:1}100%{opacity:0}}
  @keyframes vnStatic{0%,100%{opacity:0}50%{opacity:.85}}
  @keyframes vnRise{0%{opacity:0;transform:translateY(30%)}60%{opacity:1}100%{opacity:.35;transform:none}}
  #vn .vn-stage.fx-alarm,#vn .vn-stage.fx-thud{animation:vnShake .5s cubic-bezier(.36,.07,.19,.97) 1}
  #vn .vn-stage.fx-rumble{animation:vnRumble 2.4s ease-in-out 1}
  @keyframes vnShake{10%,90%{transform:translateX(-.35cqw)}30%,70%{transform:translateX(.6cqw)}
    50%{transform:translateX(-.6cqw)}100%{transform:none}}
  @keyframes vnRumble{0%,100%{transform:none}
    20%{transform:translate(.18cqw,-.12cqw)}40%{transform:translate(-.16cqw,.14cqw)}
    60%{transform:translate(.14cqw,.1cqw)}80%{transform:translate(-.1cqw,-.08cqw)}}

  /* 세로로 든 폰 — GM 화면이 아닌 경우다. 16:9로 가두면 글자가 10px 밑으로 떨어지므로
     레터박스를 풀고 화면을 채운 뒤 치수만 키운다. */
  @media(max-width:700px) and (orientation:portrait){
    #vn .vn-stage{width:100vw;height:100dvh}
    #vn .vn-line{font-size:5.2cqw}
    #vn .vn-line+.vn-line{margin-top:1.6cqw}
    #vn .vn-name{font-size:3.9cqw;margin-left:2.5cqw;padding:1.5cqw 4cqw;border-radius:1.4cqw 1.4cqw 0 0}
    #vn .vn-hint{font-size:3.1cqw}
    #vn .vn-tool{font-size:3.4cqw;padding:1.6cqw 3.8cqw;border-radius:999px}
    #vn .vn-tools{top:4cqw;right:4cqw;gap:2cqw}
    #vn .vn-box{padding:0 5cqw 7cqw}
    #vn .vn-panel{min-height:30cqw;padding:5cqw;border-radius:2cqw}
    #vn .vn-bar{margin-top:4cqw;gap:3cqw}
    #vn .vn-dot{width:1.4cqw;height:1.4cqw}
    #vn .vn-dot.on{width:4.2cqw;border-radius:.7cqw}
    #vn .vn-sprite{height:38%;bottom:36cqw;right:6cqw;border-radius:1.4cqw}
    #vn .vn-emo{font-size:22cqw;bottom:42cqw;right:12cqw}
    #vn .vn-vig{box-shadow:inset 0 0 28cqw 10cqw rgba(0,0,0,.85)}
  }
  @media(prefers-reduced-motion:reduce){
    #vn .vn-bg,#vn .vn-sprite,#vn .vn-emo{transition-duration:.01ms}
    #vn .vn-stage,#vn .vn-flash{animation:none!important}
    #vn .vn-line.typing::after{animation:none}
  }

  /* 페이즈 전환 시네마틱 오버레이 */
  #phaseFx{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,rgba(10,8,12,.86),rgba(4,3,6,.97));opacity:0}
  #phaseFx.on{display:flex}
  #phaseFx .fx-in{max-width:82vw;text-align:center;transform:translateY(0)}
  #phaseFx .fx-kick{font-size:12px;letter-spacing:.5em;color:var(--ember-b);margin-bottom:18px;text-transform:uppercase}
  #phaseFx .fx-name{font-family:"Nanum Myeongjo","AppleMyungjo",serif;font-weight:700;color:#efe7db;
    font-size:clamp(34px,8vw,72px);letter-spacing:.14em;line-height:1.1;text-shadow:0 8px 44px rgba(0,0,0,.85)}
  #phaseFx .fx-line{margin-top:22px;color:#cbc3d8;font-size:clamp(14px,2.3vw,18px);font-style:italic;line-height:1.8;min-height:1.2em}
  @keyframes fxFade{0%{opacity:0}12%{opacity:1}82%{opacity:1}100%{opacity:0}}
  @keyframes fxRise{0%{opacity:0;transform:translateY(26px);filter:blur(7px);letter-spacing:.34em}100%{opacity:1;transform:none;filter:blur(0)}}
  #phaseFx.play{animation:fxFade var(--fxdur,2.8s) ease forwards}
  #phaseFx.play .fx-in{animation:fxRise .9s cubic-bezier(.16,.8,.24,1) both}
  /* 페이즈별 결 */
  #phaseFx.k-open{--fxdur:3.2s}
  #phaseFx.k-invest .fx-kick{color:var(--cold)}
  #phaseFx.k-invest .fx-name{color:#dfe9f2}
  #phaseFx.k-talk .fx-kick{color:var(--gold-b)}
  /* 교내방송(인터루드가 있는 페이즈) — 방송 라벨 + 스캔라인 깜빡임 */
  #phaseFx.pa .fx-kick::after{content:"  ·  📢 교내방송";opacity:.85}
  #phaseFx.pa .fx-line{color:#e8dfb0;font-style:normal;letter-spacing:.04em}
  @keyframes paFlicker{0%,100%{opacity:1}42%{opacity:.62}44%{opacity:1}70%{opacity:.5}72%{opacity:1}}
  #phaseFx.pa.play .fx-line{animation:paFlicker 2.4s steps(1) both}
  #phaseFx.pa::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(255,255,255,.03) 3px 4px)}
  /* 종막 — 붉은 긴장 */
  #phaseFx.k-final{background:radial-gradient(120% 90% at 50% 45%,rgba(40,8,8,.9),rgba(3,2,4,.98))}
  #phaseFx.k-final .fx-kick,#phaseFx.k-final .fx-name{color:#f0c9c2}
  #phaseFx.k-final .fx-name{text-shadow:0 0 40px rgba(200,68,47,.5)}
  /* 진상 공개 — 여명 */
  #phaseFx.k-reveal{background:linear-gradient(0deg,rgba(60,52,30,.5),rgba(6,5,9,.96) 60%)}
  #phaseFx.k-reveal .fx-kick{color:var(--gold-b)}
  #phaseFx.k-reveal .fx-name{color:#f3ecd6;text-shadow:0 0 50px rgba(201,162,74,.55)}

  @media (prefers-reduced-motion: reduce){
    .gcard.just-open,.modal .box.reveal,.frag,#phaseFx.play,#phaseFx.play .fx-in{animation-duration:.01ms!important}
  }
</style>
</head>
<body>

    <div class="lead">각자 자기 기기에서 배역을 고르세요. 내 비밀 정보는 이 기기에만 보입니다.</div>

<div id="phaseFx"><div class="fx-in"><div class="fx-kick" id="fxKick"></div><div class="fx-name serif" id="fxName"></div><div class="fx-line" id="fxLine"></div></div></div>

<script>
"use strict";
let SCEN=null, STATE=null, myHand=[], scr="lobby", lastRev=-1, gradeBusy=false;
let clientId=localStorage.getItem("pmb.cid");
if(!clientId){clientId="c"+Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);localStorage.setItem("pmb.cid",clientId);}
let myRoleId=localStorage.getItem("pmb.role")||null;

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const roleById=id=>SCEN.characters.find(c=>c.id===id);
const cardCat=id=>SCEN.cardCatalog.find(c=>c.id===id);
const myRoleValid=()=>myRoleId&&STATE&&STATE.roles[myRoleId]&&STATE.roles[myRoleId].mode==="human";

async function loadScenario(){
  SCEN=await (await fetch("/api/scenario")).json();
  applyLanding();
}
function applyLanding(){
  if(!SCEN)return;
  // 로비 문안을 선택된 시나리오에서 채운다(시나리오 선택 자체는 허브 / 에서 한다)
  $("pTitle").textContent=SCEN.title; document.title=SCEN.title+" — PIMMmurderboard";
  $("lobbyScenName").textContent=SCEN.title;
  const be=SCEN.backend||{ok:false,label:"?"};
  $("beChip2").textContent=be.label; $("beChip2").className="pill"+(be.ok?"":" bad");
}
async function boot(){
  try{ await loadScenario(); }
  catch(e){ $("beChip2").textContent="서버 연결 실패"; $("beChip2").className="pill bad"; return; }
  await poll();
  setInterval(poll,1500);
}
async function poll(){
  // clientId를 넘겨야 서버가 isHost를 판별한다(호스트 전용 UI가 여기에 달려 있다)
  try{ STATE=await (await fetch("/api/state?clientId="+encodeURIComponent(clientId))).json(); }catch(e){ return; }
  // 다른 사람이 시나리오를 바꿨으면(허브에서) 이 기기도 새 시나리오로 갱신
  if(STATE&&SCEN&&STATE.scenarioId&&STATE.scenarioId!==SCEN.scenarioId){ try{ await loadScenario(); }catch(e){} }
  if(myRoleValid()){ try{ myHand=(await (await fetch("/api/hand/"+myRoleId+"?clientId="+encodeURIComponent(clientId))).json()).hand||[]; }catch(e){} }
  else myHand=[];
  applyState();
}
function go(name){ scr=name; ["lobby","play","gm"].forEach(s=>$("s-"+s).classList.remove("on")); $("s-"+name).classList.add("on"); if(name==="play")$("s-play").style.display="flex"; if(name==="gm")$("s-gm").style.display="flex"; lastRev=-1; fxSeq=null; renderPanel._sig=null; if(name==="gm")gmSeenMarks=null; if(name==="play")handSeen=null; applyState(); }
let gmKey=localStorage.getItem("pmb.gmkey")||"";
function enterGM(){
  if(gmKey==null)gmKey="";
  const k=prompt("GM 키를 입력하세요.\n· 로컬(내 PC)에서 인터넷 없이 진행하면 그냥 [확인]\n· 클라우드(Render) 배포본이면 배포 때 넣은 AGENT_KEY", gmKey||"");
  if(k===null)return;               // 취소
  gmKey=k.trim(); localStorage.setItem("pmb.gmkey",gmKey);
  go("gm");
}

function applyState(){
  if(!STATE)return;
  if(myRoleId&&(!STATE.roles[myRoleId]||STATE.roles[myRoleId].mode!=="human")){ myRoleId=null; localStorage.removeItem("pmb.role"); }
  // 호스트가 확정하면 배역을 가진 사람은 그대로 오프닝으로 들어간다
  if(STATE.started&&scr==="lobby"&&myRoleValid()){ go("play"); return; }
  if(scr==="lobby") renderLobby();
  else if(scr==="gm"){ renderGM(); maybePhaseFx(STATE.phase||{}); }
  else if(scr==="play"){
    const ph=STATE.phase||{};
    $("s-play").className="screen on "+(ph.key||"");
    $("pPhase").textContent=(ph.name||"")+(STATE.round?` · 조사 R${STATE.round}`:"");
    updateComposer();
    // 배너
    const il=(STATE.table||[]).slice().reverse().find(m=>m.broadcast);
    $("pbanner").innerHTML=`<span class="g">GM</span>${esc(ph.gm||"")}`;
    if(ph.key==="reveal"&&STATE.ending) $("pbanner").innerHTML=`<span class="g">GM</span>진상이 밝혀졌습니다.`;
    // 페이즈 패널
    renderPanel(ph);
    // 채팅
    if(STATE.rev!==lastRev){ renderChat(); lastRev=STATE.rev; }
    $("advBtn").style.display=(STATE.seq>=9)?"none":"";
    renderAiCall();
    maybePhaseFx(ph);
  }
}

/* ===== 페이즈 전환 시네마틱 ===== */
let fxSeq=null;
const FX_KICK={open:"막이 오른다",invest:"조사",talk:"토론",final:"종막",reveal:"진상"};
const TALK_SEQ={3:1,5:1,7:1};
function maybePhaseFx(ph){
  if((scr!=="play"&&scr!=="gm")||!STATE) return;
  if(fxSeq===STATE.seq) return;
  fxSeq=STATE.seq;
  playPhaseFx(ph);
  // 토론 페이즈: 새 기억 파편 안내(자기 배역이 있을 때)
  if(ph.key==="talk"&&TALK_SEQ[STATE.seq]&&myRoleValid()) banner("🧠 기억의 파편이 떠올랐다 — 상단 ‘내 정보’를 확인하세요.");
}
function playPhaseFx(ph){
  if(!ph||!ph.key) return;
  if(ph.key==="invest") return;   // 조사턴엔 전면 플래시 없이 조사 카드에 집중
  const fx=$("phaseFx"); if(!fx) return;
  const inter=(SCEN&&SCEN.interludes)?SCEN.interludes[String(ph.seq)]:"";
  $("fxKick").textContent=FX_KICK[ph.key]||"";
  $("fxName").textContent=ph.name||"";
  $("fxLine").textContent=inter||"";
  fx.className="on k-"+ph.key+(inter?" pa":"");
  void fx.offsetWidth;
  fx.classList.add("play");
  const dur=ph.key==="open"?3200:2800;
  clearTimeout(fx._t);
  fx._t=setTimeout(()=>{ fx.className=""; },dur+90);
}

/* 로비 — 2열 포스터 그리드. 카드 자체가 버튼이고, 부가 동작은 아래 액션바로 뺀다. */
/* 에셋은 webp를 먼저, 없으면 png를 찾는다 — 어느 포맷으로 넣어도 동작하게. */
const ASSET_EXT=["webp","png"];
function findAsset(base, cb){
  let i=0;
  const tryNext=()=>{
    if(i>=ASSET_EXT.length){ cb(null); return; }
    const url=`${base}.${ASSET_EXT[i++]}`;
    const im=new Image();
    im.onload=()=>cb(url); im.onerror=tryNext; im.src=url;
  };
  tryNext();
}
/* ── 오프닝 비주얼노벨 ─────────────────────────────────────────────
   시나리오가 openingCuts를 주면 그걸 쓰고, 없으면 intro를 두 줄씩 잘라 컷으로 만든다.
   컷: {img, who, fx, lines} — who가 있으면 그 배역이 말하는 컷이 된다.
   배경 /assets/{시나리오}_opening_{img}.{webp|png}
   인물 /assets/{시나리오}_portrait_{배역}.{webp|png}
   둘 다 없어도 그라데이션과 이모지로 그대로 성립한다. */

/* 효과음은 전부 WebAudio로 즉석 합성한다 — 음원 파일을 얹지 않아 저장소가 가볍고
   오프라인에서도 동일하게 울린다. */
let vnAC=null, vnMuted=false;
try{ vnMuted=localStorage.getItem("pmb.vn.mute")==="1"; }catch(e){}
function vnAudio(){
  if(vnMuted) return null;
  try{
    if(!vnAC) vnAC=new (window.AudioContext||window.webkitAudioContext)();
    if(vnAC.state==="suspended") vnAC.resume();
    return vnAC.state==="running" ? vnAC : null;
  }catch(e){ return null; }
}
function vnTone(freq,dur,type,gain,slideTo){
  const ac=vnAudio(); if(!ac) return;
  const t=ac.currentTime, o=ac.createOscillator(), g=ac.createGain();
  o.type=type||"sine"; o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo),t+dur);
  g.gain.setValueAtTime(.0001,t);
  g.gain.linearRampToValueAtTime(gain==null?.14:gain,t+.012);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+.05);
}
function vnNoise(dur,cutFrom,cutTo,gain){
  const ac=vnAudio(); if(!ac) return;
  const n=Math.max(1,Math.floor(ac.sampleRate*dur));
  const buf=ac.createBuffer(1,n,ac.sampleRate), d=buf.getChannelData(0);
  let last=0;                                   // 브라운 노이즈 — 화이트보다 물·굉음에 가깝다
  for(let i=0;i<n;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; d[i]=last*3.2; }
  const t=ac.currentTime, s=ac.createBufferSource(); s.buffer=buf;
  const f=ac.createBiquadFilter(); f.type="lowpass";
  f.frequency.setValueAtTime(cutFrom,t);
  f.frequency.exponentialRampToValueAtTime(Math.max(40,cutTo),t+dur);
  const g=ac.createGain();
  g.gain.setValueAtTime(gain==null?.3:gain,t);
  g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t+dur);
}
const VN_SFX={
  sonar (){ vnTone(1250,1.6,"sine",.10); setTimeout(()=>vnTone(1250,1.9,"sine",.055),340); },
  hush  (){ vnTone(320,.9,"sine",.05); },
  alarm (){ let i=0; (function beat(){ if(i++>=3||vnMuted) return;
              vnTone(880,.19,"square",.09); setTimeout(()=>vnTone(660,.24,"square",.09),200);
              setTimeout(beat,580); })(); },
  thud  (){ vnTone(140,.75,"sine",.30,38); vnNoise(.5,900,90,.22); },
  static(){ vnNoise(.75,5200,1400,.16); setTimeout(()=>vnNoise(.4,4000,900,.11),380); },
  water (){ vnNoise(2.0,260,1500,.24); },
  rumble(){ vnTone(58,2.6,"sine",.24,34); vnNoise(2.4,320,70,.18); }
};
/* 배역마다 기본 음높이를 달리 줘서, 말풍선 소리만으로도 누가 말하는지 감이 오게 한다 */
const VN_VOICE={munjaei:520,kangyunseo:645,oserin:470,jinharam:300,yutaeo:585,handokyung:262};
function vnBlip(who){
  const base=VN_VOICE[who]||395;
  vnTone(base*(.94+Math.random()*.12),.045,who?"triangle":"sine",who?.055:.032);
}
function vnToggleMute(){
  vnMuted=!vnMuted;
  try{ localStorage.setItem("pmb.vn.mute",vnMuted?"1":"0"); }catch(e){}
  $("vnMute").textContent=vnMuted?"🔇 소리":"🔊 소리";
}
/* 브라우저는 사용자 조작 없이 소리를 못 낸다. VN이 열리면 첫 탭에서 한 번만 깨운다. */
function vnArmAudio(){
  let armed=true;
  const go=()=>{
    if(!armed) return;
    const at=vnAt;
    if(!vnAudio()) return;
    armed=false; document.removeEventListener("pointerdown",go,true);
    // 같은 탭이 컷을 넘겼다면 그 컷의 효과음이 알아서 울리므로 겹쳐 울리지 않는다
    setTimeout(()=>{ const c=vnCuts[at];
      if(vnAt===at && c && c.fx && VN_SFX[c.fx]) VN_SFX[c.fx](); },0);
  };
  document.addEventListener("pointerdown",go,true);
}

let vnCuts=[], vnAt=0, vnTimer=null, vnTyping=false;
function vnBuildCuts(){
  const cuts=(SCEN&&SCEN.openingCuts)||[];
  if(cuts.length) return cuts.map(c=>({img:c.img||"",who:c.who||"",fx:c.fx||"",lines:c.lines||[]}));
  const ls=String((SCEN&&SCEN.intro)||"").split("\n").map(s=>s.trim()).filter(Boolean);
  const out=[]; for(let i=0;i<ls.length;i+=2) out.push({img:"",who:"",fx:"",lines:ls.slice(i,i+2)});
  return out;
}
function vnSeenKey(){ return "pmb.vn."+((STATE&&STATE.scenarioId)||"?"); }
function openVN(force){
  vnCuts=vnBuildCuts(); if(!vnCuts.length) return;
  if(!force&&localStorage.getItem(vnSeenKey())) return;
  vnAt=0;
  $("vnMute").textContent=vnMuted?"🔇 소리":"🔊 소리";
  $("vn").classList.add("on"); vnArmAudio(); vnRender();
}
function vnRender(){
  const cut=vnCuts[vnAt]; if(!cut) return;
  const sid=(STATE&&STATE.scenarioId)||"";
  const stage=$("vnStage"), bg=$("vnBg"), sp=$("vnSprite"), emo=$("vnEmo");

  bg.className="vn-bg "+(cut.img||"");
  bg.style.backgroundImage="";
  bg.classList.remove("show"); void bg.offsetWidth; bg.classList.add("show");
  if(sid&&cut.img){
    // 이미지가 실제로 있을 때만 덧입힌다(없으면 위의 그라데이션이 그대로 남는다)
    findAsset(`/assets/${sid}_opening_${cut.img}`, url=>{
      if(url && vnCuts[vnAt]===cut) bg.style.backgroundImage=`url("${url}")`;
    });
  }

  // 화자 — 스프라이트·이름표·강조색
  const ch=cut.who ? (SCEN.characters||[]).find(c=>c.id===cut.who) : null;
  const root=$("vn");
  root.classList.toggle("speak",!!ch);
  sp.classList.remove("show"); emo.classList.remove("show");
  if(ch){
    $("vnName").textContent=ch.name+(ch.job?" · "+ch.job:"");
    root.style.setProperty("--spk",ch.color||"#c9c2b4");
    emo.textContent=ch.avatar||"";
    if(sid){
      findAsset(`/assets/${sid}_portrait_${ch.id}`, url=>{
        if(vnCuts[vnAt]!==cut) return;
        if(url){ sp.src=url; sp.classList.add("show"); }
        else { emo.classList.add("show"); }
      });
    } else { emo.classList.add("show"); }
  } else {
    root.style.removeProperty("--spk");
  }

  // 연출 큐 — 클래스를 지웠다 다시 붙여야 애니메이션이 처음부터 다시 돈다
  stage.className="vn-stage"; void stage.offsetWidth;
  if(cut.fx){
    stage.classList.add("fx-"+cut.fx);
    const play=VN_SFX[cut.fx]; if(play) play();
  }

  $("vnDots").innerHTML=vnCuts.map((_,i)=>`<span class="vn-dot${i===vnAt?" on":""}"></span>`).join("");
  vnType(cut.lines||[], cut.who||"");
}
/* 한 글자씩 찍는다. 문장부호에서 한 박자 쉬어야 대사로 읽힌다.
   글자를 덧붙이는 게 아니라 전체를 깔아두고 안 읽은 쪽을 감추는 방식이라,
   타자가 진행돼도 줄갈이가 처음 잡힌 그대로 유지된다. */
function vnLineHTML(txt,shown){
  return `<span class="vn-on">${esc(txt.slice(0,shown))}</span>`+
         `<span class="vn-off">${esc(txt.slice(shown))}</span>`;
}
function vnType(lines,who){
  const host=$("vnLines");
  host.innerHTML=lines.map(t=>`<div class="vn-line">${vnLineHTML(t,0)}</div>`).join("");
  const els=Array.prototype.slice.call(host.children);
  let li=0, ci=0;
  vnTyping=true; vnHintText();
  const step=()=>{
    if(li>=lines.length){ vnTyping=false; vnHintText(); return; }
    const txt=lines[li], el=els[li];
    if(ci===0) el.classList.add("typing");
    if(ci>=txt.length){ el.classList.remove("typing"); li++; ci=0; vnTimer=setTimeout(step,360); return; }
    const ch=txt.charAt(ci); ci++;
    el.innerHTML=vnLineHTML(txt,ci);
    if(ci%2===0) vnBlip(who);
    vnTimer=setTimeout(step, ".…—?!,".indexOf(ch)>=0 ? 165 : 34);
  };
  clearTimeout(vnTimer); step();
}
function vnHintText(){
  $("vnHint").textContent = vnTyping ? "탭하면 전체 표시"
    : (vnAt>=vnCuts.length-1 ? "탭하면 시작합니다" : "화면을 탭하면 다음");
}
/* 탭 한 번은 "지금 찍는 글자 전부 표시", 그다음 탭이 다음 컷 */
function vnAdvance(){
  if(vnTyping){
    clearTimeout(vnTimer); vnTyping=false;
    const cut=vnCuts[vnAt]||{};
    $("vnLines").innerHTML=(cut.lines||[]).map(l=>
      `<div class="vn-line">${vnLineHTML(l,l.length)}</div>`).join("");
    vnHintText(); return;
  }
  if(vnAt>=vnCuts.length-1){ vnClose(); return; }
  vnAt++; vnRender();
}
function vnClose(){
  clearTimeout(vnTimer); vnTyping=false;
  $("vn").classList.remove("on");
  try{ localStorage.setItem(vnSeenKey(),"1"); }catch(e){}
}

function portraitHTML(c){
  // 규약: /assets/{시나리오}_portrait_{배역}.{webp|png}
  // webp가 없으면 png로, 그것도 없으면 스스로 지워져 이모지가 드러난다.

function renderLobby(){
  const locked=!!(STATE&&STATE.started);   // 시작 후에는 배역을 바꿀 수 없다
  const cards=SCEN.characters.map(c=>{
    const r=STATE.roles[c.id]||{}; const mine=myRoleId===c.id;
    const otherHuman=!mine&&r.mode==="human";
    let badge="", btn="";
    if(mine){
      badge=`<span class="badge me">● 나</span>`;
      btn=`<button class="rc-go mine" onclick="showMySheet()">🗂️ 내 정보</button>`;
    }else if(otherHuman){
      badge=`<span class="badge hu">사람</span>`;
      btn=`<span class="rc-go off">참여 중</span>`;
    }else if(r.mode==="ai"){
      badge=`<span class="badge ai">AI</span>`;
      btn=locked?`<span class="rc-go off">AI</span>`:`<button class="rc-go" onclick="setAI('${c.id}')">AI 해제</button>`;
    }else{
      btn=locked?`<span class="rc-go off">-</span>`:`<button class="rc-go pick" onclick="claim('${c.id}')">선택</button>`;

function renderGM(){

  $("gmPhase").textContent=(ph.name||"")+(cur?` · R${cur}`:"")+(ap?` · 인당 ${ap}장`:"");
  $("gmAdvBtn").style.display=(STATE.seq>=9)?"none":"";

      ais.map(c=>`<span class="aichip" style="--sc:${c.color}" onclick="aiSay('${c.id}')"><span class="d"></span>${esc(c.name)}</span>`).join("")+

function buildGMBody(ph,cur,ap,k,checked,used,fresh){
  const inter=(SCEN.interludes||{})[String(ph.seq)]||"";
  if(k==="open") return gmCinematic("막이 오른다 · 공통지문 낭독", (SCEN.intro||""), SCEN.victim,
    "각자 <b>내 정보</b>로 자기소개를 나눈 뒤, 준비되면 <b>다음 페이즈 ›</b>로 <b>조사 R1</b>을 여세요.");
  if(k==="final") return gmCinematic("종막 · 질문지", (SCEN.finalQuestions||[]).map((q,i)=>`${i+1}. ${q}`).join("\n"), "",
    "각자 자기 기기에서 서술로 답합니다. 답이 모이면 이 세션(Claude)이 진상 기준으로 채점하고, 엔딩을 낭독합니다.");
  if(k==="reveal") return gmCinematic("진상 공개", (STATE.ending?STATE.ending.desc:"채점이 끝나면 엔딩이 열립니다."), (STATE.ending?("— "+STATE.ending.name):""),
    "이 세션이 진상과 엔딩을 전해주면, 낭독으로 밤을 닫으세요.");
  // invest / talk → 마킹 매트릭스 (그 라운드에 열린 카드만)
  const cat=(SCEN.cardCatalog||[]).filter(c=>c.round<=cur);
  const locs=[]; const byLoc={};
  cat.forEach(c=>{ if(!byLoc[c.loc]){byLoc[c.loc]=[];locs.push(c.loc);} byLoc[c.loc].push(c); });
  let h=`<div class="gm-guide"><span class="g">GM 지문</span>${esc(ph.gm||"")}${inter?`<div class="il">📢 “${esc(inter)}”</div>`:""}</div>`;
  if(k==="invest") h+=gmTurnBar();
  if(k==="invest") h+=`<div class="gm-note">순번대로 조사합니다. <b>AI 차례</b>면 <b>🤖 자동 조사</b>를 눌러 그 인물이 알아서 카드를 고르게 하세요(즉시). 사람 차례면 “○○ 카드 봤어요”라고 말할 때 그 줄의 칸을 눌러 마킹하고, 끝나면 <b>다음 차례 ›</b>. 다시 누르면 해제 — 카드 <b>내용은 진행자에게 보이지 않습니다</b>.</div>`;
  else h+=`<div class="gm-note">토론 페이즈 — 새로 조사할 카드는 없습니다. 아래는 지금까지의 조사 현황입니다. 충분히 이야기했으면 <b>다음 페이즈 ›</b>.</div>`;
  h+=`<div class="gm-legend"><span><b style="background:var(--panel2)"></b>미조사</span><span><b style="background:linear-gradient(150deg,#3a2c12,#6a5320)"></b>조사함 ✓</span></div>`;
  SCEN.characters.forEach(c=>{
    const rl=STATE.roles[c.id]||{}; const kind=rl.mode==="human"?"사람":(rl.mode==="ai"?"AI":"빈자리");
    const u=used[c.id]||0; const full=ap>0&&u>=ap; const ck=checked[c.id]||[];
    let cells="";
    locs.forEach(loc=>{
      const cards=byLoc[loc]; let cc="";
      cards.forEach(cd=>{ const on=ck.includes(cd.id); const jm=fresh&&fresh.has(c.id+":"+cd.id);
        cc+=`<div class="cell${on?' on':''}${jm?' justmark':''}" style="--cc:${c.color}" onclick="gmMark('${c.id}','${cd.id}')" title="${esc(cd.locName)}${cd.spot?' · '+esc(cd.spot):''} · R${cd.round}${cd.requires?' · '+cd.requires+' 선행':''}">${cd.id}${cd.requires?`<span class="rq">${cd.requires}▶</span>`:""}</div>`;
      });
      cells+=`<div class="gm-loc"><div class="lh">${loc} · ${esc(cards[0].locName)}</div><div class="cs">${cc}</div></div>`;
    });
    const cnt=k==="invest"?`이번 턴 ${u}/${ap} 조사`:`조사 ${ck.length}장`;
    h+=`<div class="gm-row"><div class="who"><div class="nm" style="color:${c.color}">${c.avatar} ${esc(c.name)}</div><div class="kind">${kind}</div><div class="cnt${full?' full':''}">${cnt}</div></div><div class="gm-cells">${cells}</div></div>`;
  });
  return h;
}
function gmCinematic(kick, body, tail, note){
  const lines=String(body||"").split("\n").filter(x=>x.trim());
  let h=`<div class="gm-cine"><div class="ck">${esc(kick)}</div>`;
  lines.forEach((ln,i)=>{ h+=`<div class="ln serif" style="animation-delay:${(i*0.55).toFixed(2)}s">${esc(ln)}</div>`; });
  let d=lines.length*0.55;
  if(tail) h+=`<div class="vic serif" style="animation-delay:${d.toFixed(2)}s">${esc(tail)}</div>`, d+=0.55;
  if(note) h+=`<div class="go" style="animation-delay:${d.toFixed(2)}s">${note}</div>`;
  return h+`</div>`;
}
function updateAiSelect(){
  const sel=$("gmAiRole"); const prev=sel.value;
  const ais=SCEN.characters.filter(c=>(STATE.roles[c.id]||{}).mode==="ai");
  const opts=ais.map(c=>`<option value="${c.id}">${c.avatar} ${esc(c.name)}</option>`).join("")||`<option value="">AI 배역 없음</option>`;

}
async function gmSay(){

  if(r&&r.error){ gmBanner(r.error==="key"?"GM 키가 올바르지 않습니다 — AI 대사 전송에도 AGENT_KEY가 필요합니다.":("전송 오류: "+r.error)); return; }

    renderMap($("cmap")); }
  else if(k==="talk"){

let handSeen=null;
function renderMap(el){
  const revIds=(STATE.revealedIds||[]); const handIds=myHand.map(c=>c.id); const cr=STATE.round||0;
  const ap=(STATE.phase||{}).ap||0; const used=(STATE.usedAP||{})[myRoleId]||0; const apOut=myRoleValid()&&ap>0&&used>=ap;
  const pub={}; (STATE.revealed||[]).forEach(c=>pub[c.id]=c); const hand={}; myHand.forEach(c=>hand[c.id]=c);
  // 새로 손패에 들어온 카드 = 뒤집힘 애니메이션 1회
  const curHand=new Set(handIds); let fresh=new Set();
  if(handSeen===null) handSeen=curHand; else { curHand.forEach(id=>{ if(!handSeen.has(id))fresh.add(id); }); handSeen=curHand; }
  const spotOf=(c)=>c.spot||"";
  const cardHTML=(c)=>{
    const sp=spotOf(c), spl=sp?`<div class="spot">${esc(sp)}</div>`:"";
    if(pub[c.id]) return `<div class="gcard pub${pub[c.id].bait?' baitc':''}" onclick="openCard('${c.id}')"><span class="tag">공개</span><div class="rb">R${c.round}</div><div class="t">${esc(pub[c.id].title)}${spl}</div></div>`;
    if(hand[c.id]) return `<div class="gcard hand${fresh.has(c.id)?' just-open':''}" onclick="openCard('${c.id}')"><span class="tag">손패</span><div class="rb">R${c.round}·비공개</div><div class="t">${esc(hand[c.id].title)}${spl}</div></div>`;
    // 조사카드는 한 사람만 갖는다 — 남이 이미 가져간 카드는 그 배역 색으로 잠긴다.
    const taker=Object.keys(STATE.checked||{}).find(rid=>rid!==myRoleId&&(STATE.checked[rid]||[]).includes(c.id));
    if(taker){ const tc=roleById(taker)||{};
      return `<div class="gcard face taken" style="--tc:${tc.color||'#777'}"><div class="q">${tc.avatar||'🔒'}</div>${sp?`<div class="sp">${esc(sp)}</div>`:""}<div class="rb">${esc(tc.name||'')} 조사함</div></div>`; }
    const allIds=new Set(revIds); Object.values(STATE.checked||{}).forEach(a=>(a||[]).forEach(x=>allIds.add(x)));
    const reqOk=!c.requires||allIds.has(c.requires); const roundOk=c.round<=cr;
    const turn=STATE.turn; const myTurn=(!turn)||turn===myRoleId;
    if(roundOk&&reqOk&&myRoleValid()&&!apOut&&myTurn) return `<div class="gcard face" onclick="investigate('${c.id}')"><span class="tag">조사</span>${sp?`<div class="sp">${esc(sp)}</div>`:`<div class="q">?</div>`}<div class="rb">R${c.round}</div></div>`;
    return `<div class="gcard face locked">${sp?`<div class="sp">${esc(sp)}</div>`:`<div class="q">🔒</div>`}<div class="rb">${!roundOk?"R"+c.round:(!myRoleValid()?"관전":(!myTurn?"내 차례 아님":(apOut?"턴 소진":"선행 필요")))}</div></div>`;
  };
  // 이번 라운드에 열린 카드만(+이미 가진 것) — 아직 안 열린 카드는 감춰 정보 과부하 방지
  const cardsOf=(loc)=>SCEN.cardCatalog.filter(c=>c.loc===loc && (c.round<=cr || pub[c.id] || hand[c.id]));
  // 시나리오가 정의한 존(map)마다 방 상자 하나 — 아이콘+이름 헤더 + 그 위치의 카드
  const zones=(SCEN.map&&SCEN.map.length)?SCEN.map:[];
  const room=(z)=>{ const cards=cardsOf(z.loc); return cards.length?`<div class="room"><div class="rmh">${z.icon||"📍"} ${esc(z.name||z.loc)}</div><div class="cardmap">${cards.map(cardHTML).join("")}</div></div>`:""; };
  el.innerHTML=`<div class="floormap generic">${zones.map(room).join("")}</div>`;
}
/* ── 심층심문 — 상대가 지금 손패로 쥔 카드를 지목해 답을 요구한다(예산 소모, 그 자리에서 공개) ── */

  const voteBtn=(!ig.bonusGranted&&ig.voteNeed>0)?`<button class="btn sm" onclick="interrogVote()">🗳️ 추가 심문 신청 (${ig.voteHave}/${ig.voteNeed})</button>`:(ig.bonusGranted?`<span class="pill" style="color:var(--good)">추가 심문 승인됨</span>`:"");

    <div class="panel-note">상대가 지금 손패로 쥔 카드를 지목해 답을 요구합니다. 카드 자체는 공개되지 않아요 — 대답만 듣는 거고, 민감한 비밀이면 그 대답이 진짜라는 보장도 없습니다(몰리면 거짓말·딴소리로 넘어가요).<br><br>

/* ── 스와이프 카드 캐러셀 (실물카드처럼 옆으로 넘겨보기) ── */
function buildSwipe(slides){
  const track=slides.map(s=>`<div class="sw-slide">${s}</div>`).join("");
  const dots=slides.map((_,i)=>`<span class="sw-dot${i===0?" on":""}" data-i="${i}"></span>`).join("");
  // 좌우 화살표를 카드 위에 겹쳐 띄우면 글이 길 때 본문을 가린다 — 카드 아래 컨트롤 줄에 둔다.
  const ctrls=slides.length>1?`<div class="sw-ctrl"><button class="sw-nav prev" aria-label="이전">‹</button><div class="sw-dots">${dots}</div><button class="sw-nav next" aria-label="다음">›</button></div><div class="sw-count"><b class="sw-cur">1</b> / ${slides.length} · 옆으로 넘겨보세요</div>`:"";
  return `<div class="swipe"><div class="sw-track">${track}</div>${ctrls}</div>`;
}
function wireSwipe(box){
  const sw=box.querySelector(".swipe"); if(!sw)return;
  const track=sw.querySelector(".sw-track"); const slides=[...sw.querySelectorAll(".sw-slide")];
  const dots=[...sw.querySelectorAll(".sw-dot")]; const prev=sw.querySelector(".sw-nav.prev"); const next=sw.querySelector(".sw-nav.next");
  const cur=()=>Math.round(track.scrollLeft/track.clientWidth);
  const upd=()=>{ const i=cur(); dots.forEach((d,j)=>d.classList.toggle("on",j===i)); const c=sw.querySelector(".sw-cur"); if(c)c.textContent=i+1; if(prev)prev.disabled=i<=0; if(next)next.disabled=i>=slides.length-1; };
  const goTo=i=>{ i=Math.max(0,Math.min(slides.length-1,i)); track.scrollTo({left:i*track.clientWidth,behavior:"smooth"}); };
  track.addEventListener("scroll",()=>{ clearTimeout(track._t); track._t=setTimeout(upd,60); },{passive:true});
  if(prev)prev.onclick=()=>goTo(cur()-1);
  if(next)next.onclick=()=>goTo(cur()+1);
  dots.forEach(d=>d.onclick=()=>goTo(+d.dataset.i));
  upd();
}

/* 내 정보(배역 시트) — 실물카드처럼 스와이프로 넘겨보기(큰 글씨) */
async function showMySheet(){
  if(!myRoleValid())return;
  let s; try{ s=await (await fetch("/api/sheet/"+myRoleId+"?clientId="+encodeURIComponent(clientId))).json(); }catch(e){ banner("큐카드 로드 실패"); return; }
  if(s.error){ banner(s.error); return; }
  const curPhase=(STATE&&STATE.phase)?STATE.phase.name:"";
  const slides=[];
  // 1) 정체 슬라이드
  slides.push(`<div class="bigcard role" style="--rc:${s.color}">
    <div class="bc-eyebrow">나의 배역</div>
    <div class="bc-avwrap"><div class="bc-av">${s.avatar}</div><div><div class="bc-title role">${esc(s.name)}</div><div class="bc-sub">${esc(s.age?s.age+" · ":"")}${esc(s.job)}</div></div></div>
    <div class="bc-body">${esc(s.persona)}</div>
    ${s.hidden?`<div class="bc-hidden">⚑ 스포일러 배역 — 정체를 들키지 마세요</div>`:``}</div>`);
  // 2) 시트 항목 슬라이드
  (s.sheet||[]).forEach(x=>{ slides.push(`<div class="bigcard role" style="--rc:${s.color}">
    <div class="bc-eyebrow">큐카드</div><div class="bc-title" style="font-size:18px">${esc(x.h)}</div>
    <div class="bc-body">${esc(x.b)}</div></div>`); });
  // 3) 떠오른 기억
  const frags=(s.fragments||[]);
  if(frags.length){ const fh=frags.map((f,i,arr)=>{ const isNew=(f.when===curPhase&&i===arr.length-1); return `<div class="frag${isNew?" newfrag":""}"><div class="w">기억의 파편 · ${esc(f.when)}${isNew?" · NEW":""}</div>${esc(f.text)}</div>`; }).join("");
    slides.push(`<div class="bigcard role" style="--rc:${s.color}"><div class="bc-eyebrow">떠오른 기억</div><div class="bc-title" style="font-size:18px">기억의 파편</div><div style="margin-top:14px">${fh}</div></div>`); }
  // 4) 나의 목표
  slides.push(`<div class="bigcard role" style="--rc:${s.color}"><div class="bc-eyebrow">나의 목표</div><div class="bc-title" style="font-size:18px">이번 밤, 내가 노리는 것</div>
    <div style="margin-top:12px">${(s.goals||[]).map(g=>`<div class="bc-goal"><span>${esc(g.t)}</span><span class="pt">+${g.p}</span></div>`).join("")}</div></div>`);
  $("sheetBox").innerHTML=`<h2 style="color:${s.color};font-size:18px">${s.avatar} ${esc(s.name)} <span style="font-size:12.5px;color:var(--muted)">· 내 정보</span></h2>
    <div class="mlead">실물 카드처럼 <b>옆으로 넘겨</b> 확인하세요.</div>
    ${buildSwipe(slides)}
    <div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal('sheetModal')">확인</button></div>`;
  openModal("sheetModal"); wireSwipe($("sheetBox"));
}
/* 내 단서(손패) — 어느 페이즈에서든 다시 확인. 조사한 카드는 사라지지 않는다. 큼지막하게 스와이프. */
function showMyHand(){
  if(!myRoleValid()){ banner("배역을 맡아야 단서가 있어요"); return; }
  const cards=myHand.slice();
  let h=`<h2 style="font-size:18px">🃏 내 단서 <span style="font-size:13px;color:var(--muted)">· 손패 ${cards.length}장 (비공개)</span></h2>
    <div class="mlead">내가 조사한 단서예요. <b>언제든 다시 확인</b>할 수 있고 사라지지 않아요. 알리려면 대화로 말하세요.</div>`;
  if(!cards.length){ h+=`<div class="panel-note">아직 조사한 단서가 없어요. 조사 페이즈에 카드를 열면 여기에 계속 쌓입니다.</div>`; }
  else{ const slides=cards.map(c=>`<div class="bigcard clue">
      <div class="bc-eyebrow">손패 · 비공개</div>
      <div class="bc-title" style="color:var(--gold-b)">${esc(c.title)}</div>
      <div class="bc-tags"><span class="pill">${esc(c.locName)}</span>${c.spot?`<span class="pill">${esc(c.spot)}</span>`:''}<span class="pill">R${c.round}</span>${c.bait?'<span class="pill bad">※미끼일 수도</span>':''}</div>
      <div class="bc-body">${esc(c.text)}</div>${cnote(c)}</div>`);
    h+=buildSwipe(slides); }
  h+=`<div style="margin-top:14px;text-align:right"><button class="btn" onclick="closeModal('handModal')">확인</button></div>`;
  $("handBox").innerHTML=h;
  openModal("handModal"); wireSwipe($("handBox"));
}

async function post(url,body){ try{ return await (await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json(); }catch(e){ banner("서버 연결 오류"); return {error:"network"}; } }
function openModal(id){ $(id).classList.add("on"); } function closeModal(id){ $(id).classList.remove("on"); }
$("input").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); humanSay(); }});
$("input").addEventListener("input",e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(96,e.target.scrollHeight)+"px"; });
$("gmAiInput").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); gmSay(); }});
$("gmAiInput").addEventListener("input",e=>{ e.target.style.height="auto"; e.target.style.height=Math.min(96,e.target.scrollHeight)+"px"; });
boot();
</script>
